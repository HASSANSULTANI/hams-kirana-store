<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HAMS Kirana Store - Admin Order Management">
<title>HAMS Kirana Store — Admin Orders</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f4;
    color:#172017;
}

button,input,select{font:inherit}

.top{
    background:#166534;
    color:#fff;
    text-align:center;
    padding:9px 14px;
    font-size:13px;
}

header{
    position:sticky;
    top:0;
    z-index:20;
    background:#fff;
    border-bottom:1px solid #e3e9e3;
}

.head{
    max-width:1250px;
    margin:auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logoicon{
    width:42px;
    height:42px;
    border-radius:11px;
    background:#15803d;
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:22px;
}

.logo h1{font-size:19px}
.logo small{color:#68736a}

.wrap{
    max-width:1250px;
    margin:auto;
    padding:20px 18px 40px;
}

.toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
}

.search{
    flex:1;
    padding:12px 14px;
    border:1px solid #dfe7df;
    border-radius:11px;
    outline:none;
    background:#fff;
}

.refresh{
    border:0;
    border-radius:10px;
    background:#15803d;
    color:#fff;
    padding:11px 15px;
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
}

.auto-refresh-select{
    border:1px solid #dfe7df;
    border-radius:10px;
    background:#fff;
    color:#172017;
    padding:10px 34px 10px 11px;
    cursor:pointer;
    font-weight:700;
    min-width:145px;
    outline:none;
}

.auto-refresh-select:focus{
    border-color:#15803d;
    box-shadow:0 0 0 2px rgba(21,128,61,.12);
}

.refresh-info{
    color:#68736a;
    font-size:12px;
    white-space:nowrap;
}

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    border:1px solid #e1e8e1;
    border-radius:13px;
    padding:13px;
}

.stat strong{
    display:block;
    font-size:21px;
    margin-top:5px;
}

.stat span{
    color:#68736a;
    font-size:11px;
}

.filters{
    display:flex;
    gap:8px;
    overflow:auto;
    padding-bottom:4px;
    margin-bottom:18px;
}

.filter{
    flex:0 0 auto;
    border:1px solid #dce4dc;
    background:#fff;
    color:#315338;
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
}

.filter.active{
    background:#15803d;
    color:#fff;
    border-color:#15803d;
}

.orders{
    display:grid;
    gap:14px;
}

.order{
    background:#fff;
    border:1px solid #dfe7df;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px #00000008;
}

.order-head{
    padding:14px 16px;
    background:#f0fdf4;
    border-bottom:1px solid #dce8de;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.order-id{
    font-weight:800;
    color:#166534;
}

.time{
    color:#68736a;
    font-size:11px;
    margin-top:3px;
}

.status{
    border:1px solid #cbd8cd;
    border-radius:9px;
    padding:8px 9px;
    background:#fff;
    font-weight:700;
    font-size:11px;
    min-width:145px;
}

.order-body{
    padding:15px 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.section{
    border:1px solid #e7ece7;
    border-radius:11px;
    overflow:hidden;
}

.section-title{
    padding:9px 11px;
    background:#fafcf9;
    color:#166534;
    font-size:12px;
    font-weight:800;
}

.section-body{
    padding:10px 11px;
    font-size:12px;
    line-height:1.55;
}

.customer{
    display:grid;
    gap:5px;
}

.customer b{font-size:13px}

.items{
    width:100%;
    border-collapse:collapse;
}

.items th,
.items td{
    padding:7px 5px;
    border-bottom:1px solid #edf0ed;
    text-align:left;
    font-size:11px;
}

.items th:last-child,
.items td:last-child{
    text-align:right;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    padding-top:9px;
    border-top:1px solid #dfe7df;
    font-weight:800;
    color:#166534;
}


.status-flow{
    display:flex;
    align-items:center;
    gap:0;
    margin-top:10px;
    overflow:auto;
    padding:2px 0 5px;
}
.status-step{
    display:flex;
    align-items:center;
    flex:0 0 auto;
    color:#94a09a;
    font-size:10px;
    font-weight:700;
}
.status-dot{
    width:24px;
    height:24px;
    border-radius:50%;
    border:2px solid #d7e0d8;
    background:#fff;
    display:grid;
    place-items:center;
    margin-right:4px;
}
.status-step.done{color:#166534}
.status-step.done .status-dot{
    border-color:#15803d;
    background:#15803d;
    color:#fff;
}
.status-step.current{color:#166534}
.status-step.current .status-dot{
    border-color:#166534;
    box-shadow:0 0 0 3px rgba(21,128,61,.12);
}
.status-line{
    width:28px;
    height:2px;
    background:#d7e0d8;
    margin:0 5px;
}
.status-line.done{background:#15803d}
.quick-status{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
}
.quick-status button{
    border:1px solid #d8e2d9;
    background:#fff;
    color:#315338;
    border-radius:7px;
    padding:6px 8px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
}
.quick-status button:hover{
    border-color:#15803d;
    color:#166534;
}
.actions{
    padding:12px 16px;
    border-top:1px solid #e7ece7;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action.whatsapp{background:#25D366;color:#fff;border-color:#25D366}
.action.status-wa{background:#128C7E;color:#fff;border-color:#128C7E}
.action{

    text-decoration:none;
    border:1px solid #15803d;
    background:#fff;
    color:#166534;
    border-radius:8px;
    padding:8px 11px;
    font-size:11px;
    font-weight:700;
}

.empty{
    text-align:center;
    padding:50px 20px;
    background:#fff;
    border:1px dashed #cdd8ce;
    border-radius:14px;
    color:#68736a;
}

.loading{
    text-align:center;
    padding:40px;
    color:#68736a;
}

.notice{
    display:none;
    margin-bottom:14px;
    padding:11px 13px;
    border-radius:10px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#9a3412;
    font-size:12px;
}

@media(max-width:900px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .order-body{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .head{
        padding:11px 13px;
    }

    .logo h1{font-size:16px}

    .wrap{
        padding:14px 10px 30px;
    }

    .toolbar{
        align-items:stretch;
        flex-wrap:wrap;
    }

    .refresh{
        padding:10px 11px;
    }

    .auto-refresh-select{
        flex:1;
        min-width:130px;
    }

    .refresh-info{
        width:100%;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .order-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .status{
        width:100%;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr;
    }

    .action{
        text-align:center;
    }
}
</style>
</head>

<body>

<div class="top">
    HAMS Kirana Store • Admin Order Management
</div>

<header>
    <div class="head">
        <div class="logo">
            <div class="logoicon">H</div>
            <div>
                <h1>HAMS Kirana Store</h1>
                <small>Order Management</small>
            </div>
        </div>
    </div>
</header>

<main class="wrap">

    <div class="toolbar">
        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search Order ID, customer, mobile..."
            autocomplete="off"
        >
        <button class="refresh" onclick="manualRefresh()">
            ↻ Refresh
        </button>

        <select
            id="autoRefreshInterval"
            class="auto-refresh-select"
            aria-label="Auto refresh interval"
            onchange="changeAutoRefreshInterval()"
        >
            <option value="1">Auto Refresh: 1 Minute</option>
            <option value="2">Auto Refresh: 2 Minutes</option>
            <option value="3">Auto Refresh: 3 Minutes</option>
            <option value="4">Auto Refresh: 4 Minutes</option>
            <option value="5">Auto Refresh: 5 Minutes</option>
            <option value="10">Auto Refresh: 10 Minutes</option>
            <option value="15">Auto Refresh: 15 Minutes</option>
            <option value="20">Auto Refresh: 20 Minutes</option>
            <option value="30">Auto Refresh: 30 Minutes</option>
            <option value="60">Auto Refresh: 1 Hour</option>
        </select>

        <span id="refreshInfo" class="refresh-info" aria-live="polite"></span>
    </div>

    <div id="notice" class="notice"></div>

    <div id="stats" class="stats"></div>

    <div id="filters" class="filters"></div>

    <div id="orders" class="orders">
        <div class="loading">Loading orders...</div>
    </div>

</main>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwnwcBSQG9ACJy-fbZbbuc_8tiiZP1UmKwrbemlMlDEiMpTBDiR6WgAntX6_fOPkxvT/exec";

/* This value must match ADMIN_KEY in Code.gs. */
const ADMIN_KEY = "03ce2a7c1c657acf55ac0c4bc220f91a";

/*
 * AUTO REFRESH
 * The admin can choose the refresh interval from the dropdown.
 * A manual Refresh always resets the countdown, so the page will not
 * automatically refresh again until the selected interval has passed.
 * The selected interval is remembered in this browser.
 */
const AUTO_REFRESH_OPTIONS = [
    1, 2, 3, 4, 5, 10, 15, 20, 30, 60
];
const AUTO_REFRESH_STORAGE_KEY = "hamsKiranaAdminAutoRefreshMinutes";
let autoRefreshMinutes = 1;
let lastRefreshAt = Date.now();
let autoRefreshTimer = null;

function getSavedAutoRefreshMinutes(){
    try{
        const saved = Number(
            localStorage.getItem(AUTO_REFRESH_STORAGE_KEY)
        );

        if(AUTO_REFRESH_OPTIONS.includes(saved)){
            return saved;
        }
    }catch(error){
        console.warn("Could not read auto-refresh preference.", error);
    }

    return 1;
}

function saveAutoRefreshMinutes(){
    try{
        localStorage.setItem(
            AUTO_REFRESH_STORAGE_KEY,
            String(autoRefreshMinutes)
        );
    }catch(error){
        console.warn("Could not save auto-refresh preference.", error);
    }
}

function formatRefreshInterval(minutes){
    if(minutes === 60){
        return "1 hour";
    }

    return minutes + " min";
}

function updateRefreshInfo(){
    const info = document.getElementById("refreshInfo");

    if(!info){
        return;
    }

    const intervalMs = autoRefreshMinutes * 60 * 1000;
    const elapsed = Date.now() - lastRefreshAt;
    const remainingMs = Math.max(0, intervalMs - elapsed);
    const remainingSeconds = Math.ceil(remainingMs / 1000);

    if(remainingSeconds <= 0){
        info.textContent = "Refreshing...";
        return;
    }

    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    if(minutes > 0){
        info.textContent =
            "Next auto-refresh in " +
            minutes + "m " +
            String(seconds).padStart(2, "0") + "s";
    }else{
        info.textContent =
            "Next auto-refresh in " +
            seconds + "s";
    }
}

function changeAutoRefreshInterval(){
    const select = document.getElementById("autoRefreshInterval");
    const selected = Number(select.value);

    if(!AUTO_REFRESH_OPTIONS.includes(selected)){
        return;
    }

    autoRefreshMinutes = selected;
    lastRefreshAt = Date.now();
    saveAutoRefreshMinutes();
    updateRefreshInfo();
    startAutoRefresh();
}

const STATUSES = [
    "NEW",
    "CONFIRMED",
    "PACKING",
    "OUT FOR DELIVERY",
    "DELIVERED",
    "CANCELLED"
];

let orders = [];
let activeFilter = "ALL";

document
    .getElementById("search")
    .addEventListener("input", render);

autoRefreshMinutes = getSavedAutoRefreshMinutes();

document.getElementById("autoRefreshInterval").value =
    String(autoRefreshMinutes);

loadOrders(false);
startAutoRefresh();
updateRefreshInfo();

function manualRefresh(){
    // Manual refresh resets the countdown using the currently selected interval.
    lastRefreshAt = Date.now();
    updateRefreshInfo();
    loadOrders(true);
}

function startAutoRefresh(){
    if(autoRefreshTimer){
        clearInterval(autoRefreshTimer);
    }

    autoRefreshTimer = setInterval(function(){
        const intervalMs = autoRefreshMinutes * 60 * 1000;
        const elapsed = Date.now() - lastRefreshAt;

        const active = document.activeElement;
        const userIsEditing =
            active &&
            (active.tagName === "SELECT" ||
             active.tagName === "INPUT" ||
             active.tagName === "TEXTAREA" ||
             active.isContentEditable);

        if(elapsed >= intervalMs && !userIsEditing){
            lastRefreshAt = Date.now();
            updateRefreshInfo();
            loadOrders(false);
        }else{
            updateRefreshInfo();
        }
    }, 1000);
}

async function loadOrders(isManualRefresh){

    showNotice("");

    document.getElementById("orders").innerHTML =
        '<div class="loading">Loading orders...</div>';

    try{

        const url =
            API_URL +
            "?action=orders&key=" +
            encodeURIComponent(ADMIN_KEY) +
            "&t=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error("Could not connect to Apps Script.");
        }

        const data =
            await response.json();

        if(!data.success){
            throw new Error(
                data.message || "Could not load orders."
            );
        }

        orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        renderStats();
        renderFilters();
        render();

    }catch(error){

        console.error(error);

        showNotice(error.message);

        document.getElementById("orders").innerHTML =
            '<div class="empty">Orders could not be loaded.</div>';

    }
}

function render(){

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const filtered =
        orders.filter(function(order){

            const matchesFilter =
                activeFilter === "ALL" ||
                order.status === activeFilter;

            if(!matchesFilter){
                return false;
            }

            const haystack = [
                order.orderId,
                order.name,
                order.mobile,
                order.city,
                order.area,
                order.status
            ]
            .join(" ")
            .toLowerCase();

            return haystack.includes(search);

        });

    if(!filtered.length){

        document.getElementById("orders").innerHTML =
            '<div class="empty">No matching orders found.</div>';

        return;

    }

    document.getElementById("orders").innerHTML =
        filtered
            .map(renderOrder)
            .join("");

}

function renderStats(){

    const counts = {
        ALL: orders.length,
        NEW: 0,
        CONFIRMED: 0,
        PACKING: 0,
        "OUT FOR DELIVERY": 0,
        DELIVERED: 0,
        CANCELLED: 0
    };

    orders.forEach(function(order){

        if(counts[order.status] !== undefined){
            counts[order.status]++;
        }

    });

    document.getElementById("stats").innerHTML = [
        statCard("All Orders", counts.ALL),
        statCard("New", counts.NEW),
        statCard("Confirmed", counts.CONFIRMED),
        statCard("Packing", counts.PACKING),
        statCard("Out for Delivery", counts["OUT FOR DELIVERY"]),
        statCard("Delivered", counts.DELIVERED)
    ].join("");

}

function statCard(label, value){

    return `
        <div class="stat">
            <span>${esc(label)}</span>
            <strong>${value}</strong>
        </div>
    `;

}

function renderFilters(){

    const labels = [
        ["ALL","All"],
        ["NEW","New"],
        ["CONFIRMED","Confirmed"],
        ["PACKING","Packing"],
        ["OUT FOR DELIVERY","Out for Delivery"],
        ["DELIVERED","Delivered"],
        ["CANCELLED","Cancelled"]
    ];

    document.getElementById("filters").innerHTML =
        labels.map(function(pair){

            const key = pair[0];
            const label = pair[1];

            return `
                <button
                    class="filter ${activeFilter === key ? "active" : ""}"
                    onclick="setFilter('${js(key)}')"
                >
                    ${esc(label)}
                </button>
            `;

        }).join("");

}

function setFilter(filter){

    activeFilter = filter;

    renderFilters();
    render();

}

function renderStatusFlow(order){

    const flow = [
        "NEW",
        "CONFIRMED",
        "PACKING",
        "OUT FOR DELIVERY",
        "DELIVERED"
    ];

    const currentIndex = flow.indexOf(order.status);

    const steps = flow.map(function(status, index){
        const done = currentIndex >= 0 && index < currentIndex;
        const current = status === order.status;

        return `
            <div class="status-step ${done ? "done" : ""} ${current ? "current" : ""}">
                <span class="status-dot">${done ? "✓" : (index + 1)}</span>
                <span>${esc(status)}</span>
            </div>
            ${index < flow.length - 1 ? `<span class="status-line ${currentIndex >= 0 && index < currentIndex ? "done" : ""}"></span>` : ""}
        `;
    }).join("");

    const quick = order.status === "CANCELLED"
        ? `<button onclick="quickStatus('${js(order.orderId)}','NEW')">Reopen → NEW</button>`
        : flow
            .filter(function(status){ return status !== order.status; })
            .map(function(status){
                return `<button onclick="quickStatus('${js(order.orderId)}','${js(status)}')">→ ${esc(status)}</button>`;
            }).join("");

    return `
        <div style="padding:10px 16px 0;background:#fff">
            <div class="status-flow">${steps}</div>
            ${order.status === "CANCELLED" ? `<div class="quick-status"><button onclick="quickStatus('${js(order.orderId)}','NEW')">↩ Reopen Order</button></div>` : `<div class="quick-status">${quick}</div>`}
        </div>
    `;
}

function quickStatus(orderId, newStatus){
    const order = getOrderById(orderId);
    if(!order || order.status === newStatus){
        return;
    }

    const select = document.getElementById("status-" + orderId);
    if(select){
        select.value = newStatus;
    }

    changeStatus(orderId, newStatus);
}

function renderOrder(order){

    const items =
        Array.isArray(order.items)
            ? order.items
            : [];

    const itemRows =
        items.length
            ? items.map(function(item){

                return `
                    <tr>
                        <td>${esc(item.product)}</td>
                        <td>${item.quantity}</td>
                        <td>₹${money(item.price)}</td>
                        <td>₹${money(item.total)}</td>
                    </tr>
                `;

            }).join("")
            : `
                <tr>
                    <td colspan="4">No item details available.</td>
                </tr>
            `;

    const address = [
        order.houseFlat,
        order.building,
        order.street,
        order.area,
        order.city,
        order.pincode
    ].filter(Boolean).join(", ");

    const mapButton =
        order.mapsLink
            ? `
                <a
                    class="action"
                    href="${attr(order.mapsLink)}"
                    target="_blank"
                    rel="noopener"
                >
                    📍 Open Google Maps
                </a>
            `
            : "";

    const callButton =
        order.mobile
            ? `
                <a
                    class="action"
                    href="tel:${attr(order.mobile)}"
                >
                    📞 Call Customer
                </a>
            `
            : "";

    const whatsappButton =
        order.mobile
            ? `
                <a
                    class="action whatsapp"
                    href="#"
                    onclick="openWhatsAppOrder('${js(order.orderId)}'); return false;"
                >
                    💬 WhatsApp Order
                </a>
                <a
                    class="action status-wa"
                    href="#"
                    onclick="openWhatsAppStatus('${js(order.orderId)}'); return false;"
                >
                    📲 Send Status
                </a>
            `
            : "";

    return `
        <article class="order">

            <div class="order-head">

                <div>
                    <div class="order-id">
                        ${esc(order.orderId)}
                    </div>

                    <div class="time">
                        ${esc(order.timestamp)}
                    </div>
                </div>

                <select
                    class="status"
                    id="status-${attr(order.orderId)}"
                    onchange="changeStatus('${js(order.orderId)}', this.value)"
                >
                    ${STATUSES.map(function(status){
                        return `
                            <option
                                value="${attr(status)}"
                                ${status === order.status ? "selected" : ""}
                            >
                                ${esc(status)}
                            </option>
                        `;
                    }).join("")}
                </select>

            </div>

            ${renderStatusFlow(order)}

            <div class="order-body">

                <section class="section">

                    <div class="section-title">
                        👤 Customer
                    </div>

                    <div class="section-body customer">

                        <b>${esc(order.name || "—")}</b>

                        <div>
                            📱 ${esc(order.mobile || "—")}
                        </div>

                        <div>
                            💳 ${esc(order.paymentMethod || "Cash on Delivery")}
                        </div>

                    </div>

                </section>

                <section class="section">

                    <div class="section-title">
                        🏠 Delivery Address
                    </div>

                    <div class="section-body">

                        ${esc(address || "—")}

                        ${
                            order.landmark
                                ? `<br><strong>Landmark:</strong> ${esc(order.landmark)}`
                                : ""
                        }

                        ${
                            order.mapAddress
                                ? `<br><strong>Map Address:</strong> ${esc(order.mapAddress)}`
                                : ""
                        }

                        ${
                            order.latitude !== "" &&
                            order.longitude !== ""
                                ? `<br><strong>Coordinates:</strong> ${esc(order.latitude)}, ${esc(order.longitude)}`
                                : ""
                        }

                    </div>

                </section>

                <section class="section" style="grid-column:1/-1">

                    <div class="section-title">
                        🛍️ Items

async function changeStatus(orderId, newStatus){

    const order =
        orders.find(function(item){
            return item.orderId === orderId;
        });

    if(!order){
        return;
    }

    const oldStatus = order.status;

    if(oldStatus === newStatus){
        return;
    }

    if(!confirm(
        "Change " +
        orderId +
        " from \"" +
        oldStatus +
        "\" to \"" +
        newStatus +
        "\"?"
    )){
        render();
        return;
    }

    try{

        showNotice("");

        const url =
            API_URL +
            "?action=updateStatus" +
            "&key=" +
            encodeURIComponent(ADMIN_KEY) +
            "&orderId=" +
            encodeURIComponent(orderId) +
            "&status=" +
            encodeURIComponent(newStatus) +
            "&t=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error("Status update failed.");
        }

        const data =
            await response.json();

        if(!data.success){
            throw new Error(
                data.message || "Status update failed."
            );
        }

        order.status = newStatus;

        renderStats();
        renderFilters();
        render();

    }catch(error){

        console.error(error);

        showNotice(
            error.message ||
            "Could not update order status."
        );

        render();

    }

}


function getOrderById(orderId){
    return orders.find(function(item){
        return item.orderId === orderId;
    }) || null;
}

function buildAdminWhatsAppOrderMessage(order){
    const address = [
        order.houseFlat,
        order.building,
        order.street,
        order.area,
        order.city,
        order.pincode
    ].filter(Boolean).join(", ");

    const itemLines = (order.items || []).map(function(item){
        return "• " +
            item.product +
            " × " +
            item.quantity +
            " @ ₹" +
            money(item.price) +
            " = ₹" +
            money(item.total);
    }).join("\n");

    return [
        "🛒 HAMS KIRANA STORE",
        "ORDER DETAILS",
        "",
        "Order ID: " + order.orderId,
        "",
        "👤 CUSTOMER",
        "Name: " + (order.name || "—"),
        "Mobile: " + (order.mobile || "—"),
        "",
        "🏠 DELIVERY ADDRESS",
        address || "—",
        order.landmark ? "Landmark / Instructions: " + order.landmark : "",
        "",
        "📍 GOOGLE MAPS",
        order.mapsLink || "Location link not provided",
        "",
        "🛍️ ITEMS",
        itemLines || "No items",
        "",
        "💰 TOTAL: ₹" + money(order.total),
        "Payment: " + (order.paymentMethod || "Cash on Delivery"),
        "",
        "Status: " + (order.status || "NEW"),
        "",
        "Thank you for ordering from HAMS Kirana Store."
    ].filter(function(line){
        return line !== null && line !== undefined;
    }).join("\n");
}

function openWhatsAppOrder(orderId){
    const order = getOrderById(orderId);

    if(!order || !order.mobile){
        alert("Customer mobile number is not available.");
        return;
    }

    const phone = normalizeWhatsApp(order.mobile);
    const message = buildAdminWhatsAppOrderMessage(order);

    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank", "noopener");
}

function normalizeWhatsApp(number){

    const digits =
        String(number || "")
            .replace(/\D/g,"");

    if(digits.length === 10){
        return "91" + digits;
    }

    return digits;

}

function money(value){

    return (
        Number(value) || 0
    ).toLocaleString(
        "en-IN",
        {
            maximumFractionDigits:2
        }
    );

}

function showNotice(message){

    const box =
        document.getElementById("notice");

    if(!message){

        box.style.display = "none";
        box.textContent = "";
        return;

    }

    box.textContent = message;
    box.style.display = "block";

}

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function attr(value){
    return esc(value);
}

function js(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}
