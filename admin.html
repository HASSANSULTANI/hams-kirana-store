<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HAMS Kirana Store - Admin Order Management">
<title>HAMS Kirana Store — Admin Orders</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f4;
    color:#172017;
}

button,input,select{font:inherit}

.top{
    background:#166534;
    color:#fff;
    text-align:center;
    padding:9px 14px;
    font-size:13px;
}

header{
    position:sticky;
    top:0;
    z-index:20;
    background:#fff;
    border-bottom:1px solid #e3e9e3;
}

.head{
    max-width:1250px;
    margin:auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logoicon{
    width:42px;
    height:42px;
    border-radius:11px;
    background:#15803d;
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:22px;
}

.logo h1{font-size:19px}
.logo small{color:#68736a}

.wrap{
    max-width:1250px;
    margin:auto;
    padding:20px 18px 40px;
}

.toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
}

.search{
    flex:1;
    padding:12px 14px;
    border:1px solid #dfe7df;
    border-radius:11px;
    outline:none;
    background:#fff;
}

.refresh{
    border:0;
    border-radius:10px;
    background:#15803d;
    color:#fff;
    padding:11px 15px;
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
}

.auto-refresh-select{
    border:1px solid #dfe7df;
    border-radius:10px;
    background:#fff;
    color:#172017;
    padding:10px 34px 10px 11px;
    cursor:pointer;
    font-weight:700;
    min-width:145px;
    outline:none;
}

.auto-refresh-select:focus{
    border-color:#15803d;
    box-shadow:0 0 0 2px rgba(21,128,61,.12);
}

.refresh-info{
    color:#68736a;
    font-size:12px;
    white-space:nowrap;
}

.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:#fff;
    border:1px solid #e1e8e1;
    border-radius:13px;
    padding:13px;
}

.stat strong{
    display:block;
    font-size:21px;
    margin-top:5px;
}

.stat span{
    color:#68736a;
    font-size:11px;
}

.filter-group-title{
    width:100%;
    font-size:11px;
    font-weight:800;
    color:#68736a;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin:2px 0 4px;
}

.filter-row{
    display:flex;
    gap:8px;
    overflow:auto;
    padding-bottom:3px;
    width:100%;
}

.status-title{
    margin-top:6px;
}

.date-filter{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:10px;
}
.date-filter-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}
.date-filter-select{
    border:1px solid #dce4dc;
    background:#fff;
    color:#315338;
    border-radius:9px;
    padding:8px 34px 8px 12px;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
    outline:none;
    min-width:150px;
}
.date-filter-select:focus{
    border-color:#15803d;
    box-shadow:0 0 0 2px rgba(21,128,61,.12);
}
.date-sub-row{
    display:flex;
    gap:8px;
    overflow:auto;
    padding-bottom:3px;
    width:100%;
}
.date-sub-container{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:100%;
}
.date-hierarchy-block{
    display:flex;
    flex-direction:column;
    gap:3px;
    width:100%;
}
.date-hierarchy-title{
    color:#68736a;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
}
.date-input{
    border:1px solid #dce4dc;
    background:#fff;
    color:#315338;
    border-radius:9px;
    padding:8px 10px;
    font-size:12px;
    font-weight:700;
    outline:none;
}
.date-input:focus{
    border-color:#15803d;
    box-shadow:0 0 0 2px rgba(21,128,61,.12);
}
.date-range-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}
.date-apply-btn{
    border:1px solid #15803d;
    background:#15803d;
    color:#fff;
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}
.date-filter-error{
    color:#b91c1c;
    font-size:11px;
    font-weight:700;
}
.items-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}
.item-count-badge{
    color:#166534;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.filters{
    display:flex;
    flex-direction:column;
    gap:3px;
    padding-bottom:4px;
    margin-bottom:18px;
}

.filter{
    flex:0 0 auto;
    border:1px solid #dce4dc;
    background:#fff;
    color:#315338;
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
}

.filter.active{
    background:#15803d;
    color:#fff;
    border-color:#15803d;
}

/* ORDER SORTING */
.sorting{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 18px}
.sort-title{font-size:11px;font-weight:800;color:#68736a;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.sort-row{display:flex;gap:7px;overflow:auto;padding:2px 0 4px;max-width:100%}
.sort-btn{flex:0 0 auto;border:1px solid #dce4dc;background:#fff;color:#315338;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:11px;white-space:nowrap}
.sort-btn:hover{border-color:#15803d}
.sort-btn.active{background:#effaf2;color:#166534;border-color:#15803d}

/* COLLAPSED / EXPANDED ORDER */
.order-summary{padding:12px 16px 14px;background:#fff;border-bottom:1px solid #e7ece7}
.summary-grid{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(90px,.65fr) minmax(150px,1.05fr) minmax(180px,2fr) minmax(120px,.75fr);gap:10px 18px;align-items:start}
.summary-field{min-width:0}
.summary-hidden-when-expanded{display:none}
.summary-label{display:block;color:#68736a;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.035em;margin-bottom:4px}
.summary-value{color:#172017;font-size:12px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-total{color:#166534;font-size:14px}
.order-controls{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.expand-btn{width:34px;height:34px;border:1px solid #15803d;border-radius:9px;background:#fff;color:#166534;cursor:pointer;font-size:19px;font-weight:700;line-height:1;display:grid;place-items:center}
.expand-btn:hover{background:#f0fdf4}
.order-details{
    display:block;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .55s cubic-bezier(.22,.61,.36,1),opacity .25s ease;
}
.order.expanded .order-details{
    max-height:2200px;
    opacity:1;
}
.order.expanded .expand-btn{background:#15803d;color:#fff}

/* The customer name and total are visually transferred from the compact
   summary into the expanded details. */
.transfer-target{
    transition:opacity .12s ease;
}
.transfer-clone{
    position:fixed;
    z-index:99999;
    pointer-events:none;
    margin:0;
    padding:0;
    white-space:nowrap;
    transform-origin:top left;
    will-change:transform,opacity;
    transition:transform .55s cubic-bezier(.22,.61,.36,1),opacity .16s ease;
}
.transfer-clone.name{
    color:#172017;
    font-weight:700;
}
.transfer-clone.total{
    color:#166534;
    font-weight:700;
}
@media(max-width:1200px){
    .orders{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:900px){
    .orders{grid-template-columns:repeat(2,minmax(0,1fr));}
    .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.orders{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
    align-items:start;
}
.order.expanded{
    grid-column:1 / -1;
}

.order{
    background:#fff;
    border:1px solid #dfe7df;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px #00000008;
}

.order-head{
    padding:14px 16px;
    background:#f0fdf4;
    border-bottom:1px solid #dce8de;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.order-id{
    font-weight:800;
    color:#166534;
}

.time{
    color:#68736a;
    font-size:11px;
    margin-top:3px;
}

.status{
    border:1px solid #cbd8cd;
    border-radius:9px;
    padding:8px 9px;
    background:#fff;
    font-weight:700;
    font-size:11px;
    min-width:145px;
}

.order-body{
    padding:15px 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.section{
    border:1px solid #e7ece7;
    border-radius:11px;
    overflow:hidden;
}

.section-title{
    padding:9px 11px;
    background:#fafcf9;
    color:#166534;
    font-size:12px;
    font-weight:800;
}

.section-body{
    padding:10px 11px;
    font-size:12px;
    line-height:1.55;
}

.customer{
    display:grid;
    gap:5px;
}

.customer b{font-size:13px}

.items{
    width:100%;
    border-collapse:collapse;
}

.items th,
.items td{
    padding:7px 5px;
    border-bottom:1px solid #edf0ed;
    text-align:left;
    font-size:11px;
}

.items th:last-child,
.items td:last-child{
    text-align:right;
}

/* INDIVIDUAL PRODUCT STATUS */
.product-status-buttons{
    display:flex;
    gap:5px;
    flex-wrap:nowrap;
    align-items:center;
    justify-content:flex-start;
}
.product-status-btn{
    border:1px solid #d8e2d9;
    background:#fff;
    color:#315338;
    border-radius:7px;
    padding:6px 8px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
}
.product-status-btn:hover{
    border-color:#15803d;
    color:#166534;
}
.product-status-btn.active{
    background:#15803d;
    color:#fff;
    border-color:#15803d;
}
.product-status-btn.pending.active{
    background:#fff;
    color:#166534;
    border-color:#15803d;
}
.product-status-btn.cancelled.active{
    background:#fee2e2;
    color:#b91c1c;
    border-color:#ef4444;
}
.items .cancelled-product{
    background:#f3f3f3;
    color:#858585;
}
.items .cancelled-product td{
    color:#858585;
    text-decoration-line:line-through;
    text-decoration-color:#ef4444;
    text-decoration-thickness:1.5px;
}
.items .cancelled-product .product-status-buttons{
    opacity:.85;
}
.items .cancelled-product .product-status-btn{
    color:#858585;
    text-decoration:none;
    background:#e9e9e9;
    border-color:#d5d5d5;
}
.items .cancelled-product .product-status-btn.cancelled.active{
    color:#b91c1c;
    background:#f3dada;
    border-color:#ef9a9a;
}
.cancelled-products-wrap{
    margin-top:8px;
}
.cancelled-items-wrap{
    margin-top:0;
}
.cancelled-divider td{
    padding:7px 5px 6px;
    border-bottom:0;
}
.cancelled-divider-line{
    height:3px;
    width:100%;
    background:#ef4444;
    border-radius:2px;
}
.cancelled-label{
    display:block;
    margin-top:5px;
    color:#dc2626;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
}
@media(max-width:700px){
    .items{
        min-width:680px;
    }
    .items-wrap{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }
    .product-status-buttons{
        min-width:0;
        overflow-x:auto;
    }
    .product-status-btn{
        padding:6px 7px;
        font-size:9px;
    }
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    padding-top:9px;
    border-top:1px solid #dfe7df;
    font-weight:800;
    color:#166534;
}


.status-flow{
    display:flex;
    align-items:center;
    gap:0;
    margin-top:10px;
    overflow:auto;
    padding:2px 0 5px;
}
.status-step{
    display:flex;
    align-items:center;
    flex:0 0 auto;
    color:#94a09a;
    font-size:10px;
    font-weight:700;
}
.status-dot{
    width:24px;
    height:24px;
    border-radius:50%;
    border:2px solid #d7e0d8;
    background:#fff;
    display:grid;
    place-items:center;
    margin-right:4px;
}
.status-step.done{color:#166534}
.status-step.done .status-dot{
    border-color:#15803d;
    background:#15803d;
    color:#fff;
}
.status-step.current{color:#166534}
.status-step.current .status-dot{
    border-color:#166534;
    box-shadow:0 0 0 3px rgba(21,128,61,.12);
}
.status-line{
    width:28px;
    height:2px;
    background:#d7e0d8;
    margin:0 5px;
}
.status-line.done{background:#15803d}
.quick-status{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
}
.quick-status button{
    border:1px solid #d8e2d9;
    background:#fff;
    color:#315338;
    border-radius:7px;
    padding:6px 8px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
}
.quick-status button:hover{
    border-color:#15803d;
    color:#166534;
}
.actions{
    padding:12px 16px;
    border-top:1px solid #e7ece7;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action.whatsapp{background:#25D366;color:#fff;border-color:#25D366}
.action.status-wa{background:#128C7E;color:#fff;border-color:#128C7E}
.action{

    text-decoration:none;
    border:1px solid #15803d;
    background:#fff;
    color:#166534;
    border-radius:8px;
    padding:8px 11px;
    font-size:11px;
    font-weight:700;
}

.empty{
    text-align:center;
    padding:50px 20px;
    background:#fff;
    border:1px dashed #cdd8ce;
    border-radius:14px;
    color:#68736a;
}

.loading{
    text-align:center;
    padding:40px;
    color:#68736a;
}

.notice{
    display:none;
    margin-bottom:14px;
    padding:11px 13px;
    border-radius:10px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#9a3412;
    font-size:12px;
}

@media(max-width:900px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .order-body{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .orders{grid-template-columns:1fr;}
    .head{
        padding:11px 13px;
    }

    .logo h1{font-size:16px}

    .wrap{
        padding:14px 10px 30px;
    }

    .toolbar{
        align-items:stretch;
        flex-wrap:wrap;
    }

    .refresh{
        padding:10px 11px;
    }

    .auto-refresh-select{
        flex:1;
        min-width:130px;
    }

    .refresh-info{
        width:100%;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .order-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .status{
        width:100%;
    }

    .actions{
        display:grid;
        grid-template-columns:1fr;
    }

    .action{
        text-align:center;
    }

    .order-head{
        flex-direction:row;
        align-items:center;
    }

    .order-controls{
        min-width:0;
    }

    .order-controls > div{
        min-width:0;
    }

    .summary-grid{
        grid-template-columns:1fr 1fr;
        gap:10px 12px;
    }

    .summary-value{
        font-size:11px;
    }

    .status{
        min-width:125px;
        max-width:46vw;
    }

    .sort-title{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="top">
    HAMS Kirana Store • Admin Order Management
</div>

<header>
    <div class="head">
        <div class="logo">
            <div class="logoicon">H</div>
            <div>
                <h1>HAMS Kirana Store</h1>
                <small>Order Management</small>
            </div>
        </div>
    </div>
</header>

<main class="wrap">

    <div class="toolbar">
        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search Order ID, customer, mobile..."
            autocomplete="off"
        >
        <button class="refresh" onclick="manualRefresh()">
            ↻ Refresh
        </button>

        <select
            id="autoRefreshInterval"
            class="auto-refresh-select"
            aria-label="Auto refresh interval"
            onchange="changeAutoRefreshInterval()"
        >
            <option value="1">Auto Refresh: 1 Minute</option>
            <option value="2">Auto Refresh: 2 Minutes</option>
            <option value="3">Auto Refresh: 3 Minutes</option>
            <option value="4">Auto Refresh: 4 Minutes</option>
            <option value="5">Auto Refresh: 5 Minutes</option>
            <option value="10">Auto Refresh: 10 Minutes</option>
            <option value="15">Auto Refresh: 15 Minutes</option>
            <option value="20">Auto Refresh: 20 Minutes</option>
            <option value="30">Auto Refresh: 30 Minutes</option>
            <option value="60">Auto Refresh: 1 Hour</option>
        </select>

        <span id="refreshInfo" class="refresh-info" aria-live="polite"></span>
    </div>

    <div id="notice" class="notice"></div>

    <div id="stats" class="stats"></div>

    <div id="filters" class="filters"></div>

    <div id="sorting" class="sorting"></div>

    <div id="orders" class="orders">
        <div class="loading">Loading orders...</div>
    </div>

</main>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbwnwcBSQG9ACJy-fbZbbuc_8tiiZP1UmKwrbemlMlDEiMpTBDiR6WgAntX6_fOPkxvT/exec";

/* This value must match ADMIN_KEY in Code.gs. */
const ADMIN_KEY = "03ce2a7c1c657acf55ac0c4bc220f91a";

/*
 * AUTO REFRESH
 * The admin can choose the refresh interval from the dropdown.
 * A manual Refresh always resets the countdown, so the page will not
 * automatically refresh again until the selected interval has passed.
 * The selected interval is remembered in this browser.
 */
const AUTO_REFRESH_OPTIONS = [
    1, 2, 3, 4, 5, 10, 15, 20, 30, 60
];
const AUTO_REFRESH_STORAGE_KEY = "hamsKiranaAdminAutoRefreshMinutes";
let autoRefreshMinutes = 1;
let lastRefreshAt = Date.now();
let autoRefreshTimer = null;

function getSavedAutoRefreshMinutes(){
    try{
        const saved = Number(
            localStorage.getItem(AUTO_REFRESH_STORAGE_KEY)
        );

        if(AUTO_REFRESH_OPTIONS.includes(saved)){
            return saved;
        }
    }catch(error){
        console.warn("Could not read auto-refresh preference.", error);
    }

    return 1;
}

function saveAutoRefreshMinutes(){
    try{
        localStorage.setItem(
            AUTO_REFRESH_STORAGE_KEY,
            String(autoRefreshMinutes)
        );
    }catch(error){
        console.warn("Could not save auto-refresh preference.", error);
    }
}

function formatRefreshInterval(minutes){
    if(minutes === 60){
        return "1 hour";
    }

    return minutes + " min";
}

function updateRefreshInfo(){
    const info = document.getElementById("refreshInfo");

    if(!info){
        return;
    }

    const intervalMs = autoRefreshMinutes * 60 * 1000;
    const elapsed = Date.now() - lastRefreshAt;
    const remainingMs = Math.max(0, intervalMs - elapsed);
    const remainingSeconds = Math.ceil(remainingMs / 1000);

    if(remainingSeconds <= 0){
        info.textContent = "Refreshing...";
        return;
    }

    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    if(minutes > 0){
        info.textContent =
            "Next auto-refresh in " +
            minutes + "m " +
            String(seconds).padStart(2, "0") + "s";
    }else{
        info.textContent =
            "Next auto-refresh in " +
            seconds + "s";
    }
}

function changeAutoRefreshInterval(){
    const select = document.getElementById("autoRefreshInterval");
    const selected = Number(select.value);

    if(!AUTO_REFRESH_OPTIONS.includes(selected)){
        return;
    }

    autoRefreshMinutes = selected;
    lastRefreshAt = Date.now();
    saveAutoRefreshMinutes();
    updateRefreshInfo();
    startAutoRefresh();
}

const STATUSES = [
    "NEW",
    "CONFIRMED",
    "PACKING",
    "OUT FOR DELIVERY",
    "DELIVERED",
    "CANCELLED"
];

let orders = [];

/* =========================================================
   TWO-LEVEL ORDER FILTER
   ALL    → New, Confirmed, Packing, Out for Delivery,
            Delivered, Cancelled
   OPEN   → New, Confirmed, Packing, Out for Delivery
   CLOSED → Delivered, Cancelled
========================================================= */

let activeGroup = "ALL";
let activeStatusFilter = "ALL";

/* DATE FILTER */
/*
 * Date filter hierarchy:
 * ALL TIME   -> no subordinate filter
 * YEARLY     -> Year
 * QUARTERLY  -> Year -> Quarter
 * MONTHLY    -> Year -> Month
 * WEEKLY     -> Year -> Month -> Week
 * CALENDAR   -> Specific date
 * RANGE      -> From date -> To date
 *
 * Calendar is the default and starts on today's date.
 */
let activeDateFilterMode = "CALENDAR";
let activeDateFilterYear = String(new Date().getFullYear());
let activeDateFilterQuarter = "1";
let activeDateFilterMonth = String(new Date().getMonth() + 1);
let activeDateFilterWeek = String(Math.min(5, Math.floor((new Date().getDate() - 1) / 7) + 1));
let activeCalendarDate = formatDateInput(new Date());
let activeFromDate = "";
let activeToDate = "";

/* UI-only sorting and expansion state. */
let activeSort = "DATE";
let sortDirection = "DESC";
const expandedOrders = new Set();

const FILTER_GROUPS = {
    ALL: {
        label: "All",
        statuses: [
            "ALL",
            "NEW",
            "CONFIRMED",
            "PACKING",
            "OUT FOR DELIVERY",
            "DELIVERED",
            "CANCELLED"
        ]
    },
    OPEN: {
        label: "Open",
        statuses: [
            "ALL",
            "NEW",
            "CONFIRMED",
            "PACKING",
            "OUT FOR DELIVERY"
        ]
    },
    CLOSED: {
        label: "Closed",
        statuses: [
            "ALL",
            "DELIVERED",
            "CANCELLED"
        ]
    }
};

document
    .getElementById("search")
    .addEventListener("input", render);

autoRefreshMinutes = getSavedAutoRefreshMinutes();

document.getElementById("autoRefreshInterval").value =
    String(autoRefreshMinutes);

loadOrders(false);
startAutoRefresh();
updateRefreshInfo();

function manualRefresh(){
    // Manual refresh resets the countdown using the currently selected interval.
    lastRefreshAt = Date.now();
    updateRefreshInfo();
    loadOrders(true);
}

function startAutoRefresh(){
    if(autoRefreshTimer){
        clearInterval(autoRefreshTimer);
    }

    autoRefreshTimer = setInterval(function(){
        const intervalMs = autoRefreshMinutes * 60 * 1000;
        const elapsed = Date.now() - lastRefreshAt;

        const active = document.activeElement;
        const userIsEditing =
            active &&
            (active.tagName === "SELECT" ||
             active.tagName === "INPUT" ||
             active.tagName === "TEXTAREA" ||
             active.isContentEditable);

        if(elapsed >= intervalMs && !userIsEditing){
            lastRefreshAt = Date.now();
            updateRefreshInfo();
            loadOrders(false);
        }else{
            updateRefreshInfo();
        }
    }, 1000);
}

async function loadOrders(isManualRefresh){

    showNotice("");

    document.getElementById("orders").innerHTML =
        '<div class="loading">Loading orders...</div>';

    try{

        const url =
            API_URL +
            "?action=orders&key=" +
            encodeURIComponent(ADMIN_KEY) +
            "&t=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error("Could not connect to Apps Script.");
        }

        const data =
            await response.json();

        if(!data.success){
            throw new Error(
                data.message || "Could not load orders."
            );
        }

        orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        renderStats();
        renderFilters();
        render();

    }catch(error){

        console.error(error);

        showNotice(error.message);

        document.getElementById("orders").innerHTML =
            '<div class="empty">Orders could not be loaded.</div>';

    }
}

function render(){

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const openStatuses = [
        "NEW",
        "CONFIRMED",
        "PACKING",
        "OUT FOR DELIVERY"
    ];

    const closedStatuses = [
        "DELIVERED",
        "CANCELLED"
    ];

    const filtered =
        orders.filter(function(order){

            /* Date filter */
            if(!matchesDateFilter(order)) return false;

            /* Primary group filter */
            if(activeGroup === "OPEN" &&
               !openStatuses.includes(order.status)){
                return false;
            }

            if(activeGroup === "CLOSED" &&
               !closedStatuses.includes(order.status)){
                return false;
            }

            /* Secondary status filter */
            if(activeStatusFilter !== "ALL" &&
               order.status !== activeStatusFilter){
                return false;
            }

            /* Search */
            const haystack = [
                order.orderId,
                order.name,
                order.mobile,
                order.city,
                order.area,
                order.status
            ]
            .join(" ")
            .toLowerCase();

            return haystack.includes(search);

        });

    const sorted = filtered.slice().sort(compareOrders);

    if(!sorted.length){

        document.getElementById("orders").innerHTML =
            '<div class="empty">No matching orders found.</div>';

        return;

    }

    document.getElementById("orders").innerHTML =
        sorted
            .map(renderOrder)
            .join("");

}


function renderStats(){

    const counts = {
        ALL: orders.length,
        NEW: 0,
        CONFIRMED: 0,
        PACKING: 0,
        "OUT FOR DELIVERY": 0,
        DELIVERED: 0,
        CANCELLED: 0
    };

    orders.forEach(function(order){

        if(counts[order.status] !== undefined){
            counts[order.status]++;
        }

    });

    document.getElementById("stats").innerHTML = [
        statCard("All Orders", counts.ALL),
        statCard("New", counts.NEW),
        statCard("Confirmed", counts.CONFIRMED),
        statCard("Packing", counts.PACKING),
        statCard("Out for Delivery", counts["OUT FOR DELIVERY"]),
        statCard("Delivered", counts.DELIVERED)
    ].join("");

}


function statCard(label, value){

    return `
        <div class="stat">
            <span>${esc(label)}</span>
            <strong>${value}</strong>
        </div>
    `;

}


/* =========================================================
   PRIMARY FILTERS
========================================================= */

function renderFilters(){

    const groups = [
        ["ALL", "All"],
        ["OPEN", "Open"],
        ["CLOSED", "Closed"]
    ];

    const groupHtml =
        groups.map(function(pair){

            const key = pair[0];
            const label = pair[1];

            return `
                <button
                    class="filter ${activeGroup === key ? "active" : ""}"
                    onclick="setGroup('${js(key)}')"
                >
                    ${esc(label)}
                </button>
            `;

        }).join("");

    const statusHtml =
        FILTER_GROUPS[activeGroup].statuses.map(function(status){

            const label =
                status === "ALL"
                    ? "All"
                    : status;

            return `
                <button
                    class="filter ${activeStatusFilter === status ? "active" : ""}"
                    onclick="setStatusFilter('${js(status)}')"
                >
                    ${esc(label)}
                </button>
            `;

        }).join("");

    const dateModes = [
        ["ALL", "All Time"],
        ["YEARLY", "Yearly"],
        ["QUARTERLY", "Quarterly"],
        ["MONTHLY", "Monthly"],
        ["WEEKLY", "Weekly"],
        ["CALENDAR", "Calendar"],
        ["RANGE", "From & To"]
    ];

    const dateModeHtml = dateModes.map(function(pair){
        return `<option value="${attr(pair[0])}" ${activeDateFilterMode === pair[0] ? "selected" : ""}>${esc(pair[1])}</option>`;
    }).join("");

    let dateSubHtml = "";

    if(activeDateFilterMode === "YEARLY"){
        dateSubHtml = renderDateYearButtons();

    }else if(activeDateFilterMode === "QUARTERLY"){
        dateSubHtml = `
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Year</div>
                <div class="date-sub-row">${renderDateYearButtons()}</div>
            </div>
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Quarter</div>
                <div class="date-sub-row">${[1,2,3,4].map(function(q){
                    const value = String(q);
                    return `<button class="filter ${activeDateFilterQuarter === value ? "active" : ""}" onclick="setDateQuarter('${value}')">Quarter ${q}</button>`;
                }).join("")}</div>
            </div>
        `;

    }else if(activeDateFilterMode === "MONTHLY"){
        dateSubHtml = `
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Year</div>
                <div class="date-sub-row">${renderDateYearButtons()}</div>
            </div>
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Month</div>
                <div class="date-sub-row">${renderDateMonthButtons()}</div>
            </div>
        `;

    }else if(activeDateFilterMode === "WEEKLY"){
        dateSubHtml = `
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Year</div>
                <div class="date-sub-row">${renderDateYearButtons()}</div>
            </div>
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Month</div>
                <div class="date-sub-row">${renderDateMonthButtons()}</div>
            </div>
            <div class="date-hierarchy-block">
                <div class="date-hierarchy-title">Week</div>
                <div class="date-sub-row">${[1,2,3,4,5].map(function(week){
                    const value = String(week);
                    return `<button class="filter ${activeDateFilterWeek === value ? "active" : ""}" onclick="setDateWeek('${value}')">Week ${week}</button>`;
                }).join("")}</div>
            </div>
        `;

    }else if(activeDateFilterMode === "CALENDAR"){
        dateSubHtml = `
            <input
                class="date-input"
                type="date"
                value="${attr(activeCalendarDate)}"
                onchange="setCalendarDate(this.value)"
                aria-label="Select specific date"
            >
        `;

    }else if(activeDateFilterMode === "RANGE"){
        dateSubHtml = `
            <div class="date-range-controls">
                <label>From <input id="fromDateFilter" class="date-input" type="date" value="${attr(activeFromDate)}"></label>
                <label>To <input id="toDateFilter" class="date-input" type="date" value="${attr(activeToDate)}"></label>
                <button class="date-apply-btn" type="button" onclick="applyDateRange()">Apply</button>
                ${(activeFromDate || activeToDate) ? `<button class="filter" type="button" onclick="clearDateRange()">Clear</button>` : ""}
            </div>
        `;
    }

    document.getElementById("filters").innerHTML = `
        <div class="filter-group-title">
            Date
        </div>

        <div class="date-filter">
            <div class="date-filter-controls">
                <select class="date-filter-select" aria-label="Date filter type" onchange="setDateFilterMode(this.value)">
                    ${dateModeHtml}
                </select>
            </div>
            ${dateSubHtml ? `<div class="date-sub-container">${dateSubHtml}</div>` : ""}
        </div>

        <div class="filter-group-title">
            Order Group
        </div>

        <div class="filter-row">
            ${groupHtml}
        </div>

        <div class="filter-group-title status-title">
            Status
        </div>

        <div class="filter-row">
            ${statusHtml}
        </div>
    `;

    renderSorting();
}

function renderDateYearButtons(){
    const years = getAvailableYears();

    if(!years.length){
        return `<span class="date-filter-error">No years available.</span>`;
    }

    return years.map(function(year){
        const active = String(activeDateFilterYear) === String(year);
        return `<button class="filter ${active ? "active" : ""}" onclick="setDateYear('${js(String(year))}')">${esc(year)}</button>`;
    }).join("");
}

function renderDateMonthButtons(){
    return getMonthNames().map(function(month, index){
        const value = String(index + 1);
        const active = activeDateFilterMonth === value;
        return `<button class="filter ${active ? "active" : ""}" onclick="setDateMonth('${value}')">${esc(month)}</button>`;
    }).join("");
}

function getAvailableYears(){
    const years = new Set();
    orders.forEach(function(order){
        const d = parseOrderDate(order.timestamp);
        if(d) years.add(d.getFullYear());
    });

    /* Always include the current calendar year so the hierarchy remains usable. */
    years.add(new Date().getFullYear());

    return Array.from(years).sort(function(a,b){ return b-a; });
}

function getMonthNames(){
    return ["January","February","March","April","May","June","July","August","September","October","November","December"];
}

function parseOrderDate(value){
    const raw = String(value || "").trim();
    if(!raw) return null;

    const match = raw.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)(?:[ T](\d{1,2}):([0-5]?\d)(?::([0-5]?\d))?)?/);
    if(match){
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const hour = Number(match[4] || 0);
        const minute = Number(match[5] || 0);
        const second = Number(match[6] || 0);
        const d = new Date(year, month - 1, day, hour, minute, second);
        if(!Number.isNaN(d.getTime())) return d;
    }

    const parsed = new Date(raw);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
}

function weekOfMonth(date){
    return Math.min(5, Math.floor((date.getDate() - 1) / 7) + 1);
}

function matchesDateFilter(order){
    if(activeDateFilterMode === "ALL") return true;

    const d = parseOrderDate(order.timestamp);
    if(!d) return false;

    if(activeDateFilterMode === "YEARLY"){
        return d.getFullYear() === Number(activeDateFilterYear);
    }

    if(activeDateFilterMode === "QUARTERLY"){
        return d.getFullYear() === Number(activeDateFilterYear) &&
               (Math.floor(d.getMonth() / 3) + 1) === Number(activeDateFilterQuarter);
    }

    if(activeDateFilterMode === "MONTHLY"){
        return d.getFullYear() === Number(activeDateFilterYear) &&
               (d.getMonth() + 1) === Number(activeDateFilterMonth);
    }

    if(activeDateFilterMode === "WEEKLY"){
        return d.getFullYear() === Number(activeDateFilterYear) &&
               (d.getMonth() + 1) === Number(activeDateFilterMonth) &&
               weekOfMonth(d) === Number(activeDateFilterWeek);
    }

    if(activeDateFilterMode === "CALENDAR"){
        if(!activeCalendarDate) return true;
        return formatDateInput(d) === activeCalendarDate;
    }

    if(activeDateFilterMode === "RANGE"){
        const current = formatDateInput(d);
        if(activeFromDate && current < activeFromDate) return false;
        if(activeToDate && current > activeToDate) return false;
        return true;
    }

    return true;
}

function formatDateInput(date){
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function setDateFilterMode(mode){
    const allowed = ["ALL","YEARLY","QUARTERLY","MONTHLY","WEEKLY","CALENDAR","RANGE"];
    if(!allowed.includes(mode)) return;

    activeDateFilterMode = mode;

    const today = new Date();
    const currentYear = String(today.getFullYear());
    const currentMonth = String(today.getMonth() + 1);
    const currentWeek = String(weekOfMonth(today));

    if(mode === "ALL"){
        /* No subordinate filter. */

    }else if(mode === "YEARLY"){
        const years = getAvailableYears();
        activeDateFilterYear = years.length ? String(years[0]) : currentYear;

    }else if(mode === "QUARTERLY"){
        activeDateFilterYear = currentYear;
        activeDateFilterQuarter = String(Math.floor(today.getMonth() / 3) + 1);

    }else if(mode === "MONTHLY"){
        activeDateFilterYear = currentYear;
        activeDateFilterMonth = currentMonth;

    }else if(mode === "WEEKLY"){
        activeDateFilterYear = currentYear;
        activeDateFilterMonth = currentMonth;
        activeDateFilterWeek = currentWeek;

    }else if(mode === "CALENDAR"){
        /* Calendar always opens on today's date. */
        activeCalendarDate = formatDateInput(today);

    }else if(mode === "RANGE"){
        activeFromDate = "";
        activeToDate = "";
    }

    renderFilters();
    render();
}

function setDateYear(value){
    activeDateFilterYear = String(value);
    renderFilters();
    render();
}

function setDateQuarter(value){
    activeDateFilterQuarter = String(value);
    renderFilters();
    render();
}

function setDateMonth(value){
    activeDateFilterMonth = String(value);
    renderFilters();
    render();
}

function setDateWeek(value){
    activeDateFilterWeek = String(value);
    renderFilters();
    render();
}

function setCalendarDate(value){
    activeCalendarDate = value || formatDateInput(new Date());
    renderFilters();
    render();
}

function applyDateRange(){
    const from = document.getElementById("fromDateFilter");
    const to = document.getElementById("toDateFilter");
    activeFromDate = from ? from.value : "";
    activeToDate = to ? to.value : "";

    if(activeFromDate && activeToDate && activeFromDate > activeToDate){
        showNotice("From date cannot be after To date.");
        return;
    }

    showNotice("");
    renderFilters();
    render();
}

function clearDateRange(){
    activeFromDate = "";
    activeToDate = "";
    showNotice("");
    renderFilters();
    render();
}

function renderSorting(){
    const options = [
        ["ID", "Order ID"],
        ["DATE", "Order Date & Time"],
        ["STATUS", "Order Status"],
        ["TOTAL", "Total Amount"],
        ["NAME", "Customer Name"]
    ];

    const html = options.map(function(pair){
        const key = pair[0];
        const label = pair[1];
        const active = activeSort === key;
        const arrow = active ? (sortDirection === "ASC" ? " ↑" : " ↓") : "";
        return `<button class="sort-btn ${active ? "active" : ""}" onclick="setSort('${js(key)}')" title="Sort by ${esc(label)}">${esc(label)}${arrow}</button>`;
    }).join("");

    document.getElementById("sorting").innerHTML = `
        <span class="sort-title">Sort By</span>
        <div class="sort-row">${html}</div>
    `;
}

function setSort(key){
    const allowed = ["ID", "DATE", "STATUS", "TOTAL", "NAME"];
    if(!allowed.includes(key)) return;

    if(activeSort === key){
        sortDirection = sortDirection === "ASC" ? "DESC" : "ASC";
    }else{
        activeSort = key;
        sortDirection = (key === "DATE" || key === "ID" || key === "TOTAL") ? "DESC" : "ASC";
    }

    renderSorting();
    render();
}

function compareOrders(a,b){
    let av, bv;

    if(activeSort === "ID"){
        av = orderIdSortValue(a.orderId);
        bv = orderIdSortValue(b.orderId);
    }else if(activeSort === "DATE"){
        av = dateSortValue(a.timestamp);
        bv = dateSortValue(b.timestamp);
    }else if(activeSort === "STATUS"){
        av = statusSortValue(a.status);
        bv = statusSortValue(b.status);
    }else if(activeSort === "TOTAL"){
        av = Number(a.total) || 0;
        bv = Number(b.total) || 0;
    }else{
        av = String(a.name || "").toLowerCase();
        bv = String(b.name || "").toLowerCase();
    }

    let result;
    if(typeof av === "number" && typeof bv === "number"){
        result = av - bv;
    }else{
        result = String(av).localeCompare(String(bv), undefined, {numeric:true,sensitivity:"base"});
    }

    if(result === 0){
        result = dateSortValue(b.timestamp) - dateSortValue(a.timestamp);
    }

    return sortDirection === "ASC" ? result : -result;
}

function orderIdSortValue(value){
    const match = String(value || "").match(/(\d+)\s*$/);
    return match ? Number(match[1]) : String(value || "").toLowerCase();
}

function dateSortValue(value){
    const parsed = parseOrderDate(value);
    return parsed ? parsed.getTime() : 0;
}

function statusSortValue(value){
    const order = {"NEW":1,"CONFIRMED":2,"PACKING":3,"OUT FOR DELIVERY":4,"DELIVERED":5,"CANCELLED":6};
    return order[String(value || "").toUpperCase()] || 99;
}

function toggleOrder(orderId){

    const shouldExpand = !expandedOrders.has(orderId);
    const card = document.querySelector(
        `.order[data-order-id="${cssEscape(orderId)}"]`
    );

    let transfer = null;

    if(shouldExpand && card){
        const nameSource = card.querySelector('[data-transfer-source="name"]');
        const totalSource = card.querySelector('[data-transfer-source="total"]');

        transfer = {
            name: captureTransferSource(nameSource, card),
            total: captureTransferSource(totalSource, card)
        };
    }

    if(expandedOrders.has(orderId)){
        expandedOrders.delete(orderId);
    }else{
        expandedOrders.add(orderId);
    }

    render();

    if(shouldExpand && transfer){
        requestAnimationFrame(function(){
            requestAnimationFrame(function(){
                playTransferAnimation(orderId, transfer);
            });
        });
    }
}

function cssEscape(value){
    const text = String(value ?? "");
    if(window.CSS && typeof window.CSS.escape === "function"){
        return window.CSS.escape(text);
    }
    return text.replace(/[^a-zA-Z0-9_-]/g, "\\$&");
}

function captureTransferSource(element){
    if(!element){
        return null;
    }

    const rect = element.getBoundingClientRect();
    const computed = getComputedStyle(element);

    return {
        rect: rect,
        text: element.textContent || "",
        fontFamily: computed.fontFamily,
        fontSize: computed.fontSize,
        fontWeight: computed.fontWeight,
        lineHeight: computed.lineHeight,
        letterSpacing: computed.letterSpacing
    };
}

function playTransferAnimation(orderId, transfer){

    const card = document.querySelector(
        `.order[data-order-id="${cssEscape(orderId)}"]`
    );

    if(!card){
        return;
    }

    const animations = [
        {
            key: "name",
            target: card.querySelector('[data-transfer-target="name"]')
        },
        {
            key: "total",
            target: card.querySelector('[data-transfer-target="total"]')
        }
    ];

    animations.forEach(function(item){

        const source = transfer[item.key];
        const target = item.target;

        if(!source || !target || !source.text){
            return;
        }

        const targetRect = target.getBoundingClientRect();

        if(!targetRect.width && !targetRect.height){
            return;
        }

        target.style.visibility = "hidden";

        const clone = document.createElement("span");
        clone.className = "transfer-clone " + item.key;
        clone.textContent = source.text;
        clone.style.left = source.rect.left + "px";
        clone.style.top = source.rect.top + "px";
        clone.style.fontFamily = source.fontFamily;
        clone.style.fontSize = source.fontSize;
        clone.style.fontWeight = source.fontWeight;
        clone.style.lineHeight = source.lineHeight;
        clone.style.letterSpacing = source.letterSpacing;

        document.body.appendChild(clone);

        const dx = targetRect.left - source.rect.left;
        const dy = targetRect.top - source.rect.top;

        requestAnimationFrame(function(){
            clone.style.transform = `translate(${dx}px, ${dy}px)`;
        });

        const finish = function(){
            target.style.visibility = "visible";
            clone.remove();
        };

        clone.addEventListener("transitionend", finish, {once:true});
        setTimeout(finish, 700);
    });
}


function setGroup(group){

    if(!FILTER_GROUPS[group]){
        return;
    }

    activeGroup = group;

    /* Reset secondary status whenever group changes. */
    activeStatusFilter = "ALL";

    renderFilters();
    render();

}


function setStatusFilter(status){

    const allowed =
        FILTER_GROUPS[activeGroup].statuses;

    if(!allowed.includes(status)){
        return;
    }

    activeStatusFilter = status;

    renderFilters();
    render();

}


function renderStatusFlow(order){

    const flow = [
        "NEW",
        "CONFIRMED",
        "PACKING",
        "OUT FOR DELIVERY",
        "DELIVERED"
    ];

    const currentIndex = flow.indexOf(order.status);

    const steps = flow.map(function(status, index){
        const done = currentIndex >= 0 && index < currentIndex;
        const current = status === order.status;

        return `
            <div class="status-step ${done ? "done" : ""} ${current ? "current" : ""}">
                <span class="status-dot">${done ? "✓" : (index + 1)}</span>
                <span>${esc(status)}</span>
            </div>
            ${index < flow.length - 1 ? `<span class="status-line ${currentIndex >= 0 && index < currentIndex ? "done" : ""}"></span>` : ""}
        `;
    }).join("");

    const quick = order.status === "CANCELLED"
        ? `<button onclick="quickStatus('${js(order.orderId)}','NEW')">Reopen → NEW</button>`
        : flow
            .filter(function(status){ return status !== order.status; })
            .map(function(status){
                return `<button onclick="quickStatus('${js(order.orderId)}','${js(status)}')">→ ${esc(status)}</button>`;
            }).join("");

    return `
        <div style="padding:10px 16px 0;background:#fff">
            <div class="status-flow">${steps}</div>
            ${order.status === "CANCELLED" ? `<div class="quick-status"><button onclick="quickStatus('${js(order.orderId)}','NEW')">↩ Reopen Order</button></div>` : `<div class="quick-status">${quick}</div>`}
        </div>
    `;
}

function renderOrder(order){

    const items = Array.isArray(order.items) ? order.items : [];

    const activeItems = items.filter(function(item){
        return String(item.productStatus || "PENDING").toUpperCase() !== "CANCELLED";
    });

    const cancelledItems = items.filter(function(item){
        return String(item.productStatus || "PENDING").toUpperCase() === "CANCELLED";
    });

    const calculatedTotal = activeItems.reduce(function(sum, item){
        return sum + (Number(item.total) || ((Number(item.quantity) || 0) * (Number(item.price) || 0)));
    }, 0);

    const calculatedProductCount = activeItems.length;

    function productStatusButtons(item){
        const productStatus = String(item.productStatus || "PENDING").toUpperCase();
        const row = Number(item.rowNumber) || 0;
        const oid = js(order.orderId);
        return `
            <div class="product-status-buttons" role="group" aria-label="Product status for ${attr(item.product)}">
                <button type="button" class="product-status-btn pending ${productStatus === "PENDING" ? "active" : ""}" onclick="changeProductStatus('${oid}', ${row}, 'PENDING'); event.stopPropagation();">PENDING</button>
                <button type="button" class="product-status-btn prepared ${productStatus === "PREPARED" ? "active" : ""}" onclick="changeProductStatus('${oid}', ${row}, 'PREPARED'); event.stopPropagation();">PREPARED</button>
                <button type="button" class="product-status-btn cancelled ${productStatus === "CANCELLED" ? "active" : ""}" onclick="changeProductStatus('${oid}', ${row}, 'CANCELLED'); event.stopPropagation();">CANCELLED</button>
            </div>
        `;
    }

    function productRow(item, cancelled){
        const itemTotal = Number(item.total) || ((Number(item.quantity) || 0) * (Number(item.price) || 0));
        return `
            <tr class="${cancelled ? "cancelled-product" : ""}">
                <td>${esc(item.product)}</td>
                <td>${Number(item.quantity) || 0}</td>
                <td>₹${money(item.price)}</td>
                <td>₹${money(itemTotal)}</td>
                <td>${productStatusButtons(item)}</td>
            </tr>
        `;
    }

    let activeItemRows = "";
    let cancelledItemRows = "";

    if(activeItems.length){
        activeItemRows = activeItems.map(function(item){
            return productRow(item, false);
        }).join("");
    }

    if(cancelledItems.length){
        cancelledItemRows = cancelledItems.map(function(item){
            return productRow(item, true);
        }).join("");
    }

    if(!activeItemRows){
        activeItemRows = `<tr><td colspan="5">No active item details available.</td></tr>`;
    }

    const address = [
        order.houseFlat, order.building, order.street,
        order.area, order.city, order.pincode
    ].filter(Boolean).join(", ");

    const mapButton = order.mapsLink ? `
        <a class="action" href="${attr(order.mapsLink)}" target="_blank" rel="noopener">📍 Open Google Maps</a>
    ` : "";

    const callButton = order.mobile ? `
        <a class="action" href="tel:${attr(order.mobile)}">📞 Call Customer</a>
    ` : "";

    const whatsappButton = order.mobile ? `
        <a class="action whatsapp" href="#" onclick="openWhatsAppOrder('${js(order.orderId)}'); return false;">💬 WhatsApp Order</a>
        <a class="action status-wa" href="#" onclick="openWhatsAppStatus('${js(order.orderId)}'); return false;">📲 Send Status</a>
    ` : "";

    const isExpanded = expandedOrders.has(order.orderId);
    const safeStatus = String(order.status || "NEW");

    return `
        <article class="order ${isExpanded ? "expanded" : ""}" data-order-id="${attr(order.orderId)}">

            <div class="order-head">
                <div class="order-controls">
                    <button
                        class="expand-btn"
                        type="button"
                        onclick="toggleOrder('${js(order.orderId)}')"
                        aria-label="${isExpanded ? "Collapse" : "Expand"} order ${esc(order.orderId)}"
                        title="${isExpanded ? "Collapse order" : "Expand order"}"
                    >${isExpanded ? "−" : "+"}</button>

                    <div>
                        <div class="order-id">${esc(order.orderId)}</div>
                        <div class="time">${esc(order.timestamp)}</div>
                    </div>
                </div>

                <select
                    class="status"
                    id="status-${attr(order.orderId)}"
                    onchange="changeStatus('${js(order.orderId)}', this.value)"
                >
                    ${STATUSES.map(function(status){
                        return `<option value="${attr(status)}" ${status === safeStatus ? "selected" : ""}>${esc(status)}</option>`;
                    }).join("")}
                </select>
            </div>

            <div class="order-summary">
                <div class="summary-grid">
                    <div class="summary-field">
                        <span class="summary-label">Order Number</span>
                        <span class="summary-value">${esc(order.orderId)}</span>
                    </div>
                    <div class="summary-field ${isExpanded ? "summary-hidden-when-expanded" : ""}">
                        <span class="summary-label">Items</span>
                        <span class="summary-value">${isExpanded ? "" : calculatedProductCount}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">Date &amp; Time</span>
                        <span class="summary-value">${esc(order.timestamp)}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">Customer Name</span>
                        <span class="summary-value" data-transfer-source="name" title="${attr(order.name || "—")}">${isExpanded ? "" : esc(order.name || "—")}</span>
                    </div>
                    <div class="summary-field">
                        <span class="summary-label">Total Amount</span>
                        <span class="summary-value summary-total" data-transfer-source="total">${isExpanded ? "" : "₹" + money(order.total)}</span>
                    </div>
                </div>
            </div>

            ${renderStatusFlow(order)}

            <div class="order-details">
                <div class="order-body">
                    <section class="section">
                        <div class="section-title">👤 Customer</div>
                        <div class="section-body customer">
                            <b class="transfer-target" data-transfer-target="name">${esc(order.name || "—")}</b>
                            <div>📱 ${esc(order.mobile || "—")}</div>
                            <div>💳 ${esc(order.paymentMethod || "Cash on Delivery")}</div>
                        </div>
                    </section>

                    <section class="section">
                        <div class="section-title">🏠 Delivery Address</div>
                        <div class="section-body">
                            ${esc(address || "—")}
                            ${order.landmark ? `<br><strong>Landmark:</strong> ${esc(order.landmark)}` : ""}
                            ${order.mapAddress ? `<br><strong>Map Address:</strong> ${esc(order.mapAddress)}` : ""}
                            ${order.latitude !== "" && order.longitude !== "" ? `<br><strong>Coordinates:</strong> ${esc(order.latitude)}, ${esc(order.longitude)}` : ""}
                        </div>
                    </section>

                    <section class="section" style="grid-column:1/-1">
                        <div class="section-title items-heading">
                            <span>🛍️ Items</span>
                            <span class="item-count-badge">${calculatedProductCount} item(s)</span>
                        </div>
                        <div class="section-body">
                            <div class="items-wrap">
                                <table class="items">
                                    <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th><th>Product Status</th></tr></thead>
                                    <tbody>${activeItemRows}</tbody>
                                </table>
                            </div>

                            <!-- Keep the active order total ABOVE the cancelled-products section. -->
                            <div class="total">
                                <span>Total</span>
                                <span class="transfer-target" data-transfer-target="total">₹${money(calculatedTotal)}</span>
                            </div>

                            ${cancelledItemRows ? `
                                <div class="cancelled-products-wrap">
                                    <div class="cancelled-divider">
                                        <div class="cancelled-divider-line"></div>
                                        <span class="cancelled-label">Cancelled Products</span>
                                    </div>
                                    <div class="items-wrap cancelled-items-wrap">
                                        <table class="items">
                                            <tbody>${cancelledItemRows}</tbody>
                                        </table>
                                    </div>
                                </div>
                            ` : ""}
                        </div>
                    </section>
                </div>

                <div class="actions">
                    ${mapButton}
                    ${callButton}
                    ${whatsappButton}
                </div>
            </div>

        </article>
    `;
}

async function changeStatus(orderId, newStatus){

    const order =
        orders.find(function(item){
            return item.orderId === orderId;
        });

    if(!order){
        return;
    }

    const oldStatus = order.status;

    if(oldStatus === newStatus){
        return;
    }

    if(!confirm(
        "Change " +
        orderId +
        " from \"" +
        oldStatus +
        "\" to \"" +
        newStatus +
        "\"?"
    )){
        render();
        return;
    }

    try{

        showNotice("");

        const url =
            API_URL +
            "?action=updateStatus" +
            "&key=" +
            encodeURIComponent(ADMIN_KEY) +
            "&orderId=" +
            encodeURIComponent(orderId) +
            "&status=" +
            encodeURIComponent(newStatus) +
            "&t=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error("Status update failed.");
        }

        const data =
            await response.json();

        if(!data.success){
            throw new Error(
                data.message || "Status update failed."
            );
        }

        order.status = newStatus;

        renderStats();
        renderFilters();
        render();

    }catch(error){

        console.error(error);

        showNotice(
            error.message ||
            "Could not update order status."
        );

        render();

    }

}


async function changeProductStatus(orderId, rowNumber, newProductStatus){

    const order = getOrderById(orderId);

    if(!order){
        return;
    }

    const item = (order.items || []).find(function(product){
        return Number(product.rowNumber) === Number(rowNumber);
    });

    if(!item){
        alert("Product row could not be found.");
        render();
        return;
    }

    const oldStatus = String(item.productStatus || "PENDING").toUpperCase();
    const nextStatus = String(newProductStatus || "PENDING").toUpperCase();

    if(oldStatus === nextStatus){
        return;
    }

    if(!["PENDING","PREPARED","CANCELLED"].includes(nextStatus)){
        render();
        return;
    }

    /* Only CANCELLED requires confirmation.
       PENDING and PREPARED changes happen immediately. */
    if(nextStatus === "CANCELLED" && !confirm(
        "Cancel product \"" +
        (item.product || "Product") +
        "\"?\n\nIts amount will be removed from the order total."
    )){
        render();
        return;
    }

    try{
        showNotice("");

        const url =
            API_URL +
            "?action=updateProductStatus" +
            "&key=" + encodeURIComponent(ADMIN_KEY) +
            "&orderId=" + encodeURIComponent(orderId) +
            "&rowNumber=" + encodeURIComponent(rowNumber) +
            "&productStatus=" + encodeURIComponent(nextStatus) +
            "&t=" + Date.now();

        const response = await fetch(url, {cache:"no-store"});

        if(!response.ok){
            throw new Error("Product status update failed.");
        }

        const data = await response.json();

        if(!data.success){
            throw new Error(data.message || "Product status update failed.");
        }

        item.productStatus = nextStatus;

        /* Recalculate the order total immediately in the browser. */
        recalculateOrderTotal(order);

        /* If no product is still PENDING, automatically move the
           order to OUT FOR DELIVERY (unless it is already closed). */
        const hasPendingProducts = (order.items || []).some(function(product){
            return String(product.productStatus || "PENDING").toUpperCase() === "PENDING";
        });

        if(!hasPendingProducts && order.status !== "OUT FOR DELIVERY" && order.status !== "DELIVERED" && order.status !== "CANCELLED"){
            await updateOrderStatusWithoutConfirmation(order, "OUT FOR DELIVERY");
        }

        renderStats();
        renderFilters();
        render();

    }catch(error){
        console.error(error);
        showNotice(error.message || "Could not update product status.");
        render();
    }
}

async function updateOrderStatusWithoutConfirmation(order, newStatus){
    const oldStatus = order.status;
    if(!order || oldStatus === newStatus){
        return;
    }

    const url =
        API_URL +
        "?action=updateStatus" +
        "&key=" + encodeURIComponent(ADMIN_KEY) +
        "&orderId=" + encodeURIComponent(order.orderId) +
        "&status=" + encodeURIComponent(newStatus) +
        "&t=" + Date.now();

    const response = await fetch(url, {cache:"no-store"});
    if(!response.ok){
        throw new Error("Automatic order status update failed.");
    }

    const data = await response.json();
    if(!data.success){
        throw new Error(data.message || "Automatic order status update failed.");
    }

    order.status = newStatus;
}

function recalculateOrderTotal(order){
    let total = 0;
    let quantity = 0;

    (order.items || []).forEach(function(item){
        const status = String(item.productStatus || "PENDING").toUpperCase();
        const itemTotal = Number(item.total) || ((Number(item.quantity) || 0) * (Number(item.price) || 0));

        if(status !== "CANCELLED"){
            total += itemTotal;
            quantity += Number(item.quantity) || 0;
        }
    });

    order.total = total;
    order.totalQuantity = quantity;
}

function getOrderById(orderId){
    return orders.find(function(item){
        return item.orderId === orderId;
    }) || null;
}

function buildAdminWhatsAppOrderMessage(order){
    const address = [
        order.houseFlat,
        order.building,
        order.street,
        order.area,
        order.city,
        order.pincode
    ].filter(Boolean).join(", ");

    const itemLines = (order.items || []).map(function(item){
        return "• " +
            item.product +
            " × " +
            item.quantity +
            " @ ₹" +
            money(item.price) +
            " = ₹" +
            money(item.total);
    }).join("\n");

    return [
        "🛒 HAMS KIRANA STORE",
        "ORDER DETAILS",
        "",
        "Order ID: " + order.orderId,
        "",
        "👤 CUSTOMER",
        "Name: " + (order.name || "—"),
        "Mobile: " + (order.mobile || "—"),
        "",
        "🏠 DELIVERY ADDRESS",
        address || "—",
        order.landmark ? "Landmark / Instructions: " + order.landmark : "",
        "",
        "📍 GOOGLE MAPS",
        order.mapsLink || "Location link not provided",
        "",
        "🛍️ ITEMS",
        itemLines || "No items",
        "",
        "💰 TOTAL: ₹" + money(order.total),
        "Payment: " + (order.paymentMethod || "Cash on Delivery"),
        "",
        "Status: " + (order.status || "NEW"),
        "",
        "Thank you for ordering from HAMS Kirana Store."
    ].filter(function(line){
        return line !== null && line !== undefined;
    }).join("\n");
}

function openWhatsAppOrder(orderId){
    const order = getOrderById(orderId);

    if(!order || !order.mobile){
        alert("Customer mobile number is not available.");
        return;
    }

    const phone = normalizeWhatsApp(order.mobile);
    const message = buildAdminWhatsAppOrderMessage(order);

    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank", "noopener");
}

function buildStatusWhatsAppMessage(order){
    const messages = {
        "NEW":
            "We have received your order and it is currently being reviewed.",
        "CONFIRMED":
            "Good news! Your order has been confirmed and will be prepared shortly.",
        "PACKING":
            "Your order is now being packed. We will update you when it is out for delivery.",
        "OUT FOR DELIVERY":
            "Your order is out for delivery and will reach you soon.",
        "DELIVERED":
            "Your order has been delivered successfully. Thank you for shopping with HAMS Kirana Store!",
        "CANCELLED":
            "Your order has been cancelled. Please contact HAMS Kirana Store if you need any assistance."
    };

    return [
        "🛒 HAMS KIRANA STORE",
        "",
        "Order ID: " + order.orderId,
        "Hello " + (order.name || "Customer") + ",",
        "",
        "📦 ORDER STATUS: " + order.status,
        "",
        messages[order.status] || "Your order status has been updated.",
        "",
        "Thank you,",
        "HAMS Kirana Store"
    ].join("\n");
}

function openWhatsAppStatus(orderId){
    const order = getOrderById(orderId);

    if(!order || !order.mobile){
        alert("Customer mobile number is not available.");
        return;
    }

    const phone = normalizeWhatsApp(order.mobile);
    const message = buildStatusWhatsAppMessage(order);

    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank", "noopener");
}


function normalizeWhatsApp(number){

    const digits =
        String(number || "")
            .replace(/\D/g,"");

    if(digits.length === 10){
        return "91" + digits;
    }

    return digits;

}

function money(value){

    return (
        Number(value) || 0
    ).toLocaleString(
        "en-IN",
        {
            maximumFractionDigits:2
        }
    );

}

function showNotice(message){

    const box =
        document.getElementById("notice");

    if(!message){

        box.style.display = "none";
        box.textContent = "";
        return;

    }

    box.textContent = message;
    box.style.display = "block";

}

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function attr(value){
    return esc(value);
}

function js(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}
</script>
