<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riddhi Super Market — Operations</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#111827;--green:#16a34a;--red:#dc2626;--orange:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--ink)}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:10px}.logo{font-weight:900;font-size:20px}.logo span{color:var(--green)}.spacer{flex:1}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.green{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.ghost{background:#f3f4f6}.orange{background:#f59e0b;color:#111}
main{max-width:1400px;margin:auto;padding:18px}.topgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:22px;display:block}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.nav button.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.order{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:14px}.orderhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:#eef2ff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.muted{color:var(--muted);font-size:13px}.items{margin:10px 0;padding:10px;background:#f9fafb;border-radius:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.form .wide{grid-column:1/-1}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.hide{display:none}.map{width:100%;height:260px;border:0;border-radius:12px}.small{padding:6px 8px;font-size:12px}.dangerText{color:var(--red);font-weight:800}
@media(max-width:1000px){.topgrid{grid-template-columns:repeat(3,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.topgrid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">Riddhi <span>Super Market</span> · Ops</div><div class="spacer"></div><span id="who" class="muted">Not signed in</span><div id="googleBtn"></div><button class="ghost" onclick="logout()">Logout</button></header>
<main>
<div id="login" class="card"><h2>Operations Login</h2><p class="muted">Sign in with a Google account registered in the Admin Staff sheet.</p></div>
<div id="app" class="hide">
<div class="topgrid" id="stats"></div>
<div class="nav" id="nav"></div>

<section id="ordersPanel" class="panel active"><div class="card"><div class="orderhead"><h2 style="margin-right:auto">Orders</h2><input id="orderSearch" placeholder="Search order / customer / mobile" oninput="renderOrders()"><button class="ghost" onclick="refresh()">Refresh</button></div><div id="orders"></div></div></section>
<section id="riderPanel" class="panel"><div class="card"><div class="orderhead"><h2 style="margin-right:auto">Rider Dashboard</h2><button class="ghost" onclick="refreshRider()">Refresh</button></div><div id="riderOrders"></div></div></section>
<section id="productsPanel" class="panel"><div class="card"><h2>Product Management</h2><div class="form" id="productForm"><input id="pid" placeholder="Product ID (blank = new)"><input id="pname" placeholder="Product name"><input id="pcat" placeholder="Category"><input id="pprice" type="number" placeholder="Price"><input id="pstock" type="number" placeholder="Stock"><input id="punit" placeholder="Unit"><input id="ppack" placeholder="Pack size"><input id="pimg" placeholder="Image URL"><textarea id="pdesc" class="wide" placeholder="Description"></textarea><label><input id="pavail" type="checkbox" checked> Available</label><label><input id="pfeat" type="checkbox"> Featured</label></div><button class="green" onclick="saveProduct()" style="margin-top:10px">Save Product</button><button class="ghost" onclick="clearProduct()" style="margin-top:10px">Clear</button></div><div class="card"><div class="orderhead"><h3 style="margin-right:auto">Catalog / Stock</h3><button class="ghost" onclick="loadCatalog()">Refresh</button></div><div id="productTable"></div></div></section>
<section id="inventoryPanel" class="panel"><div class="card"><h2>Inventory</h2><div id="inventory"></div></div></section>
<section id="staffPanel" class="panel"><div class="card"><h2>Staff & Riders</h2><div class="form"><input id="semail" placeholder="Google email"><input id="sname" placeholder="Name"><select id="srole"><option>STAFF</option><option>RIDER</option><option>MANAGER</option></select><input id="sphone" placeholder="Phone"><input id="svehicle" placeholder="Vehicle"><input id="sshiftdate" placeholder="Shift date YYYY-MM-DD"><input id="sstart" placeholder="Start HH:MM" value="00:00"><input id="send" placeholder="End HH:MM" value="23:59"><label><input id="sactive" type="checkbox" checked> Active</label></div><button class="green" onclick="saveStaff()" style="margin-top:10px">Save Staff / Rider</button><div id="staffTable" style="margin-top:15px"></div></div></section>
<section id="reportsPanel" class="panel"><div class="card"><h2>Sales Reports</h2><div id="reports"></div></div></section>
<section id="couponsPanel" class="panel"><div class="card"><h2>Discounts & Coupons</h2><div class="form"><input id="ccode" placeholder="CODE"><select id="ctype"><option>PERCENT</option><option>FLAT</option></select><input id="cvalue" type="number" placeholder="Value"><input id="cmin" type="number" placeholder="Minimum order"><input id="cmax" type="number" placeholder="Max discount"><input id="cstart" placeholder="Start date"><input id="cend" placeholder="End date"><input id="climit" type="number" placeholder="Usage limit (0 unlimited)"><input id="cdesc" class="wide" placeholder="Description"><label><input id="cactive" type="checkbox" checked> Active</label></div><button class="green" onclick="saveCoupon()">Save Coupon</button><div id="couponTable"></div></div></section>
<section id="settingsPanel" class="panel"><div class="card"><h2>Settings</h2><div class="form"><input id="setStore" placeholder="Store name"><input id="setWhatsapp" placeholder="WhatsApp number"><input id="setFee" placeholder="Delivery fee"><input id="setFree" placeholder="Free delivery above"><input id="setArea" class="wide" placeholder="Delivery areas"><input id="setNotify" class="wide" placeholder="Notification mode"></div><button class="green" onclick="saveSettings()">Save Settings</button></div></section>
</div></main>

<script>
const API="https://script.google.com/macros/s/AKfycbwnwcBSQG9ACJy-fbZbbuc_8tiiZP1UmKwrbemlMlDEiMpTBDiR6WgAntX6_fOPkxvT/exec";
const CLIENT_ID="666183638799-67fatp0p1p5i7glh95dsqnamq1tg6la5.apps.googleusercontent.com";
const STATUS=["PLACED","RECEIVED","CALLING CUSTOMER","CUSTOMER CONFIRMED","PICKING PRODUCTS","PRODUCT CONFIRMATION","PACKING","READY FOR DELIVERY","DELIVERY ASSIGNED","RIDER ACCEPTED","OUT FOR DELIVERY","ARRIVING","DELIVERED","CANCELLED"];
let token="",me=null,orders=[],staff=[],products=[],riderTimer=null;

function apiGet(a,p={}){return fetch(API+"?"+new URLSearchParams({action:a,...p})).then(r=>r.json())}
function apiPost(d){return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}).then(r=>r.json())}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function init(){if(!window.google?.accounts?.id){setTimeout(init,400);return}google.accounts.id.initialize({client_id:CLIENT_ID,callback:login});google.accounts.id.renderButton(document.getElementById("googleBtn"),{theme:"outline",size:"medium"})}
function login(r){apiGet("verifyAdmin",{idToken:r.credential}).then(x=>{if(!x.success)throw Error(x.message);token=r.credential;me=x.user;localStorage.setItem("riddhiAdminToken",token);localStorage.setItem("riddhiAdminUser",JSON.stringify(me));enter()}).catch(e=>alert(e.message))}
function enter(){document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");document.getElementById("who").textContent=`${me.staffName} · ${me.role}`;buildNav();refresh()}
function logout(){localStorage.removeItem("riddhiAdminToken");localStorage.removeItem("riddhiAdminUser");location.reload()}
function buildNav(){const nav=document.getElementById("nav");const tabs=[["ordersPanel","Orders"],["riderPanel","Rider"],...(me.role==="MANAGER"?[["productsPanel","Products"],["inventoryPanel","Inventory"],["staffPanel","Staff & Riders"],["reportsPanel","Reports"],["couponsPanel","Discounts"],["settingsPanel","Settings"]]:[])];nav.innerHTML=tabs.map((x,i)=>`<button class="${i===0?'active':''}" onclick="tab('${x[0]}',this)">${x[1]}</button>`).join("")}
function tab(id,b){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id==="productsPanel")loadCatalog();if(id==="inventoryPanel")loadInventory();if(id==="staffPanel")loadStaff();if(id==="reportsPanel")loadReports();if(id==="couponsPanel")loadCoupons();if(id==="settingsPanel")loadSettings();if(id==="riderPanel")refreshRider()}
function refresh(){apiGet("orders",{idToken:token}).then(x=>{if(!x.success)return alert(x.message);orders=x.orders||[];renderStats(x.stats||{});renderOrders()});if(me.role==="RIDER")refreshRider()}
function renderStats(s){document.getElementById("stats").innerHTML=["PLACED","RECEIVED","CALLING CUSTOMER","CUSTOMER CONFIRMED","PICKING PRODUCTS","PRODUCT CONFIRMATION","PACKING","READY FOR DELIVERY","DELIVERY ASSIGNED","RIDER ACCEPTED","OUT FOR DELIVERY","ARRIVING","DELIVERED","CANCELLED"].map(k=>`<div class="stat"><span class="muted">${k}</span><b>${s[k]||0}</b></div>`).join("")}
function renderOrders(){const q=(document.getElementById("orderSearch")?.value||"").toLowerCase();const a=orders.filter(o=>`${o.orderId} ${o.name} ${o.mobile} ${o.status}`.toLowerCase().includes(q));document.getElementById("orders").innerHTML=a.map(orderCard).join("")||"<p class='muted'>No orders.</p>"}
function orderCard(o){const next=nextFor(o.status,me.role);const buttons=next.map(s=>`<button class="${s==="CANCELLED"?"danger":"primary"} small" onclick="setStatus('${o.orderId}','${esc(s)}')">${s}</button>`).join(" ");const accept=(me.role==="STAFF"&&["PLACED","RECEIVED"].includes(o.status)&&(!o.assignedStaffEmail||o.assignedStaffEmail===me.email))?`<button class="green small" onclick="accept('${o.orderId}')">Take order</button>`:"";const riderAssign=me.role==="MANAGER"&&o.status==="READY FOR DELIVERY"?`<select id="r_${o.orderId}"><option value="">Select rider</option>${staff.filter(s=>s.role==="RIDER"&&s.active).map(r=>`<option value="${esc(r.email)}">${esc(r.staffName)}</option>`).join("")}</select><button class="green small" onclick="assignRider('${o.orderId}')">Assign Rider</button>`:"";const itemHtml=o.items.map(i=>`<div><b>${esc(i.product)}</b> × ${i.quantity} · ₹${i.total.toFixed(2)} · <span class="pill">${i.productStatus}</span> ${["PENDING","UNAVAILABLE"].includes(i.productStatus)&&me.role!=="RIDER"?`<button class="orange small" onclick="productStatus('${o.orderId}',${i.rowNumber},'UNAVAILABLE')">Unavailable</button>`:""} ${i.productStatus==="UNAVAILABLE"&&me.role!=="RIDER"?`<button class="green small" onclick="substitute('${o.orderId}',${i.rowNumber})">Propose replacement</button>`:""}</div>`).join("");return `<div class="order"><div class="orderhead"><b>${esc(o.orderId)}</b><span class="pill">${esc(o.status)}</span><span class="muted">${esc(o.timestamp)}</span><span class="muted" style="margin-left:auto">${esc(o.name)} · ${esc(o.mobile)}</span></div><div class="items">${itemHtml}</div><div class="muted">${esc(o.address.houseFlat)}, ${esc(o.address.building)}, ${esc(o.address.street)}, ${esc(o.address.area)}, ${esc(o.address.city)} - ${esc(o.address.pincode)}<br>${esc(o.address.landmark)}</div><p><b>₹${o.total.toFixed(2)}</b> · ${esc(o.paymentMethod)} ${o.assignedStaffName?`· Staff: ${esc(o.assignedStaffName)}`:""} ${o.riderName?`· Rider: ${esc(o.riderName)}`:""}</p><div class="nav">${accept}${buttons}${riderAssign}</div></div>`}
function nextFor(st,role){if(role==="RIDER")return st==="DELIVERY ASSIGNED"?["RIDER ACCEPTED"]:st==="RIDER ACCEPTED"?["OUT FOR DELIVERY"]:st==="OUT FOR DELIVERY"?["ARRIVING"]:st==="ARRIVING"?["DELIVERED"]:[];const map={"PLACED":["RECEIVED","CANCELLED"],"RECEIVED":["CALLING CUSTOMER","CANCELLED"],"CALLING CUSTOMER":["CUSTOMER CONFIRMED","CANCELLED"],"CUSTOMER CONFIRMED":["PICKING PRODUCTS","CANCELLED"],"PICKING PRODUCTS":["PRODUCT CONFIRMATION","CANCELLED"],"PRODUCT CONFIRMATION":["PICKING PRODUCTS","PACKING","CANCELLED"],"PACKING":["READY FOR DELIVERY","CANCELLED"],"READY FOR DELIVERY":["DELIVERY ASSIGNED","CANCELLED"]};return role==="MANAGER"?(map[st]||[]).filter(x=>x!=="DELIVERY ASSIGNED"||st==="READY FOR DELIVERY"):map[st]||[]}
function setStatus(id,status){apiPost({action:"updateStatus",idToken:token,orderId:id,status:status}).then(x=>{if(!x.success)return alert(x.message);refresh()})}
function accept(id){apiPost({action:"acceptOrder",idToken:token,orderId:id}).then(x=>{if(!x.success)return alert(x.message);refresh()})}
function productStatus(id,row,status){apiPost({action:"updateProductStatus",idToken:token,orderId:id,rowNumber:row,productStatus:status}).then(x=>{if(!x.success)return alert(x.message);refresh()})}
function substitute(id,row){const pid=prompt("Enter replacement Product ID (use Products tab to find it):");if(!pid)return;apiPost({action:"createSubstitution",idToken:token,orderId:id,rowNumber:row,replacementProductId:pid}).then(x=>{if(!x.success)return alert(x.message);alert("Replacement request sent to customer.");refresh()})}
function assignRider(id){const e=document.getElementById("r_"+id).value;if(!e)return alert("Select a rider.");apiPost({action:"assignRider",idToken:token,orderId:id,riderEmail:e}).then(x=>{if(!x.success)return alert(x.message);refresh()})}

function refreshRider(){apiGet("riderOrders",{idToken:token}).then(x=>{if(!x.success)return;document.getElementById("riderOrders").innerHTML=(x.orders||[]).map(o=>`<div class="order"><div class="orderhead"><b>${esc(o.orderId)}</b><span class="pill">${esc(o.status)}</span><span class="muted">${esc(o.name)} · ${esc(o.mobile)}</span></div><p>${esc(o.address.houseFlat)}, ${esc(o.address.building)}, ${esc(o.address.street)}, ${esc(o.address.area)}, ${esc(o.address.city)}</p><div class="nav">${o.status==="DELIVERY ASSIGNED"?`<button class="green" onclick="riderAction('${o.orderId}','RIDER ACCEPTED')">Accept Delivery</button>`:""}${o.status==="RIDER ACCEPTED"?`<button class="primary" onclick="riderAction('${o.orderId}','OUT FOR DELIVERY')">Start Delivery</button>`:""}${o.status==="OUT FOR DELIVERY"?`<button class="orange" onclick="riderAction('${o.orderId}','ARRIVING')">Arriving</button>`:""}${o.status==="ARRIVING"?`<button class="green" onclick="riderAction('${o.orderId}','DELIVERED')">Mark Delivered</button>`:""}</div><div id="gps_${o.orderId}" class="muted">GPS sharing will start while this order is active.</div></div>`).join("")||"<p class='muted'>No assigned deliveries.</p>";startGPS(x.orders||[])})}
function riderAction(id,status){apiPost({action:"riderStatus",idToken:token,orderId:id,status:status}).then(x=>{if(!x.success)return alert(x.message);refreshRider()})}
function startGPS(os){if(me.role!=="RIDER"||!navigator.geolocation)return;if(riderTimer)clearInterval(riderTimer);const active=os.find(o=>["RIDER ACCEPTED","OUT FOR DELIVERY","ARRIVING"].includes(o.status));if(!active)return;riderTimer=setInterval(()=>navigator.geolocation.getCurrentPosition(pos=>apiPost({action:"riderLocation",idToken:token,orderId:active.orderId,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,heading:pos.coords.heading,speed:pos.coords.speed}).then(()=>{}),()=>{}, {enableHighAccuracy:true,maximumAge:3000,timeout:8000}),7000)}

function loadCatalog(){apiGet("catalog").then(x=>{products=x.products||[];document.getElementById("productTable").innerHTML=`<table class="table"><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Available</th><th>Action</th></tr>`+products.map(p=>`<tr><td>${esc(p.productId)}</td><td>${esc(p.productName)}</td><td>${esc(p.category)}</td><td>₹${p.price}</td><td>${p.stock}</td><td>${p.available?"YES":"NO"}</td><td><button class="small ghost" onclick='editProduct(${JSON.stringify(p)})'>Edit</button><button class="small orange" onclick="adjustStock('${p.productId}')">Stock</button></td></tr>`).join("")+"</table>"})}
function editProduct(p){pid.value=p.productId;pname.value=p.productName;pcat.value=p.category;pprice.value=p.price;pstock.value=p.stock;punit.value=p.unit;ppack.value=p.packSize;pimg.value=p.imageUrl;pdesc.value=p.description;pavail.checked=p.available;pfeat.checked=p.featured}
function clearProduct(){document.querySelectorAll("#productForm input,#productForm textarea").forEach(x=>{if(x.type==="checkbox")x.checked=x.id==="pavail";else x.value=""})}
function saveProduct(){const x={productId:pid.value,productName:pname.value,category:pcat.value,price:Number(pprice.value),stock:Number(pstock.value),unit:punit.value,packSize:ppack.value,imageUrl:pimg.value,description:pdesc.value,available:pavail.checked,featured:pfeat.checked};apiPost({action:"saveProduct",idToken:token,product:x}).then(r=>{if(!r.success)return alert(r.message);clearProduct();loadCatalog()})}
function adjustStock(id){const q=prompt("Enter stock adjustment. Use + to add, - to remove.");if(q===null)return;apiPost({action:"adjustStock",idToken:token,productId:id,quantity:Number(q),note:"Manager stock adjustment"}).then(x=>{if(!x.success)return alert(x.message);loadCatalog()})}
function loadInventory(){apiGet("inventory",{idToken:token}).then(x=>{document.getElementById("inventory").innerHTML=(x.products||[]).map(p=>`<div class="order"><b>${esc(p.productName)}</b><span style="float:right">${p.stock} in stock</span></div>`).join("")})}
function loadStaff(){apiGet("staffList",{idToken:token}).then(x=>{staff=x.staff||[];document.getElementById("staffTable").innerHTML=`<table class="table"><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th><th>Phone</th><th>Vehicle</th></tr>`+staff.map(s=>`<tr><td>${esc(s.email)}</td><td>${esc(s.staffName)}</td><td>${s.role}</td><td>${s.active}</td><td>${esc(s.phone)}</td><td>${esc(s.vehicle)}</td></tr>`).join("")+"</table>"})}
function saveStaff(){const x={email:semail.value,staffName:sname.value,role:srole.value,phone:sphone.value,vehicle:svehicle.value,shiftDate:sshiftdate.value,startTime:sstart.value,endTime:send.value,active:sactive.checked};apiPost({action:"saveStaff",idToken:token,staff:x}).then(x=>{if(!x.success)return alert(x.message);loadStaff()})}
function loadReports(){apiGet("reports",{idToken:token}).then(x=>{if(!x.success)return alert(x.message);const s=x.summary;document.getElementById("reports").innerHTML=`<div class="topgrid"><div class="stat"><span>Orders</span><b>${s.orders}</b></div><div class="stat"><span>Delivered</span><b>${s.delivered}</b></div><div class="stat"><span>Cancelled</span><b>${s.cancelled}</b></div><div class="stat"><span>Revenue</span><b>₹${s.revenue.toFixed(2)}</b></div><div class="stat"><span>Average order</span><b>₹${s.averageOrder.toFixed(2)}</b></div></div><h3>Top products</h3><table class="table"><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr>${x.products.slice(0,30).map(p=>`<tr><td>${esc(p.product)}</td><td>${p.quantity}</td><td>₹${p.revenue.toFixed(2)}</td></tr>`).join("")}</table>`})}
function loadCoupons(){apiGet("coupons",{idToken:token}).then(x=>{document.getElementById("couponTable").innerHTML=`<table class="table"><tr><th>Code</th><th>Type</th><th>Value</th><th>Active</th><th>Used</th></tr>`+(x.coupons||[]).map(c=>`<tr><td>${esc(c.Code)}</td><td>${esc(c.Type)}</td><td>${c.Value}</td><td>${esc(c.Active)}</td><td>${c["Used Count"]}</td></tr>`).join("")+"</table>"})}
function saveCoupon(){const x={code:ccode.value,type:ctype.value,value:Number(cvalue.value),minOrder:Number(cmin.value),maxDiscount:Number(cmax.value),startDate:cstart.value,endDate:cend.value,usageLimit:Number(climit.value),description:cdesc.value,active:cactive.checked};apiPost({action:"saveCoupon",idToken:token,coupon:x}).then(r=>{if(!r.success)return alert(r.message);loadCoupons()})}
function loadSettings(){apiGet("settings",{idToken:token}).then(x=>{const s=x.settings||{};setStore.value=s.storeName||"";setWhatsapp.value=s.whatsapp||"";setFee.value=s.deliveryFee||"";setFree.value=s.freeDeliveryAbove||"";setArea.value=s.deliveryAreas||"";setNotify.value=s.notificationMode||""})}
function saveSettings(){const x={storeName:setStore.value,whatsapp:setWhatsapp.value,deliveryFee:setFee.value,freeDeliveryAbove:setFree.value,deliveryAreas:setArea.value,notificationMode:setNotify.value};apiPost({action:"saveSettings",idToken:token,settings:x}).then(r=>{if(!r.success)return alert(r.message);alert("Settings saved.")})}
window.addEventListener("load",()=>{init();token=localStorage.getItem("riddhiAdminToken")||"";try{me=JSON.parse(localStorage.getItem("riddhiAdminUser")||"null")}catch(e){}if(token&&me)apiGet("verifyAdmin",{idToken:token}).then(x=>{if(x.success)enter()})});
</script>
</body></html>
