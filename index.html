<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Akbar Rice Bill - Online Grocery Ordering">
<title>Akbar Rice Bill</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8f5;
    color:#172017;
    overflow-x:hidden;
}

button,
input,
textarea{
    font:inherit;
}

/* ============================================================
   TOP BAR
============================================================ */

.top{
    background:#166534;
    color:#fff;
    text-align:center;
    padding:7px;
    font-size:13px;
}

/* ============================================================
   HEADER
============================================================ */

header{
    position:sticky;
    top:0;
    z-index:20;
    background:#fff;
    border-bottom:1px solid #e5e9e5;
}

.head{
    max-width:1200px;
    margin:auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:16px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:max-content;
}

.logoicon{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#15803d;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:23px;
    font-weight:800;
}

.logo h1{
    font-size:20px;
}

.logo small{
    color:#68736a;
}

/* ============================================================
   SEARCH
============================================================ */

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    padding:12px 15px 12px 40px;
    border:1px solid #e5e9e5;
    border-radius:12px;
    outline:none;
    background:#fafcf9;
}

.search span{
    position:absolute;
    left:14px;
    top:11px;
}

/* ============================================================
   BUTTONS
============================================================ */

.cartbtn,
.add,
.checkout,
.place{
    border:0;
    background:#15803d;
    color:#fff;
    border-radius:10px;
    padding:11px 14px;
    cursor:pointer;
    font-weight:700;
}

.cartbtn{
    position:relative;
    transition:
        transform .18s,
        box-shadow .18s;
}

.cartbtn.bump{
    animation:cartBump .55s ease;
}

@keyframes cartBump{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.15) rotate(-2deg);
    }

    55%{
        transform:scale(1.08) rotate(2deg);
    }

    75%{
        transform:scale(.97);
    }

    100%{
        transform:scale(1);
    }
}

/* ============================================================
   ADD BUTTON
============================================================ */

.add{
    padding:9px 12px;
    min-width:82px;
    transition:
        transform .18s,
        background .18s;
}

.add:hover{
    transform:translateY(-1px);
}

.add.added{
    background:#166534;
}

/* ============================================================
   PRODUCT QUANTITY CONTROLS
============================================================ */

.product-controls{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:3px;
}

.product-qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.product-qty button{
    width:34px;
    height:34px;
    border:1px solid #dce3dd;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:20px;
    line-height:1;
    display:grid;
    place-items:center;
    transition:
        background .15s,
        transform .12s;
}

.product-qty button:hover{
    background:#f1f6f2;
}

.product-qty button:active{
    transform:scale(.9);
}

.product-qty .qty-number{
    min-width:25px;
    text-align:center;
    font-weight:800;
    font-size:16px;
}

.product-remove{
    border:0;
    background:none;
    color:#dc2626;
    cursor:pointer;
    font-size:12px;
    padding:1px 0;
}

.product-remove:hover{
    text-decoration:underline;
}

/* ============================================================
   FLYING PRODUCT ANIMATION
============================================================ */

.fly-item{
    position:fixed;
    z-index:1000;
    pointer-events:none;

    width:82px;
    height:82px;

    object-fit:cover;

    border-radius:14px;

    box-shadow:
        0 10px 30px #0004;

    border:2px solid #fff;

    background:#eef3ed;

    will-change:
        transform,
        opacity;
}

/* Sparkle effect around flying product */

.fly-sparkle{
    position:fixed;
    z-index:1001;
    pointer-events:none;

    font-size:22px;

    animation:
        sparkleFloat 1.2s ease-out forwards;
}

@keyframes sparkleFloat{

    0%{
        opacity:0;
        transform:scale(.4);
    }

    20%{
        opacity:1;
        transform:scale(1.1);
    }

    70%{
        opacity:1;
        transform:scale(.9);
    }

    100%{
        opacity:0;
        transform:scale(.3);
    }
}

/* ============================================================
   MAIN
============================================================ */

main{
    max-width:1200px;
    margin:auto;
    padding:24px 18px 70px;
}

/* ============================================================
   HERO
============================================================ */

.hero{
    background:
        linear-gradient(
            135deg,
            #166534,
            #15803d
        );

    color:#fff;

    border-radius:20px;

    padding:30px;

    margin-bottom:20px;
}

.hero h2{
    font-size:clamp(
        27px,
        5vw,
        42px
    );

    margin-bottom:6px;
}

.hero p{
    opacity:.92;
}

/* ============================================================
   ADD-TO-BASKET TOAST
============================================================ */

.basket-toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%,18px);
    z-index:3000;
    background:#111827;
    color:#fff;
    padding:14px 22px;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    line-height:1.3;
    box-shadow:0 10px 30px #0003;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
    max-width:calc(100vw - 32px);
    overflow:hidden;
    text-overflow:ellipsis;
    transition:opacity .22s ease, transform .22s ease;
}

.basket-toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:600px){
    .basket-toast{
        bottom:18px;
        font-size:14px;
        padding:12px 17px;
    }
}

/* ============================================================
   STATUS
============================================================ */

.status{
    display:none;

    background:#fff;

    border:1px solid #e5e9e5;

    border-radius:10px;

    padding:12px;

    margin-bottom:16px;
}

.status.show{
    display:block;
}

.status.err{
    color:#b91c1c;
}

/* ============================================================
   SHOP LAYOUT - CATEGORY SIDEBAR + PRODUCTS
============================================================ */

.shop-layout{
    display:grid;
    grid-template-columns:160px minmax(0,1fr);
    gap:8px;
    align-items:stretch;
    min-height:0;
}

.category-sidebar{
    width:100%;
    min-width:0;
    position:sticky;
    top:86px;
    align-self:start;
}

.cats{
    display:flex;
    flex-direction:column;
    gap:7px;
    width:100%;
    margin:0;
    padding:0 4px 4px 0;
    height:calc(100vh - 180px);
    min-height:280px;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:#aeb8b0 transparent;
}

.cats::-webkit-scrollbar{
    width:7px;
}

.cats::-webkit-scrollbar-track{
    background:transparent;
}

.cats::-webkit-scrollbar-thumb{
    background:#aeb8b0;
    border-radius:10px;
}

.cat{
    width:100%;
    min-height:38px;
    border:1px solid #dfe6e0;
    background:#fff;
    border-radius:5px;
    padding:9px 10px;
    cursor:pointer;
    white-space:normal;
    text-align:left;
    font-size:11px;
    line-height:1.25;
    font-weight:600;
    color:#1f2937;
    box-shadow:0 1px 2px #00000008;
    transition:
        background .18s ease,
        color .18s ease,
        border-color .18s ease,
        transform .12s ease,
        box-shadow .18s ease;
}

.cat:hover{
    border-color:#15803d;
    box-shadow:0 3px 10px #0000000d;
    transform:translateY(-1px);
}

.cat:active{
    transform:translateY(0);
}

.cat.active{
    background:#15803d;
    color:#fff;
    border-color:#15803d;
    box-shadow:0 3px 9px #15803d26;
}

.products-area{
    min-width:0;
    min-height:0;
}

/* Independent product scrolling panel.
   Scrolling here never moves the category sidebar. */
.product-scroll{
    height:calc(100vh - 180px);
    min-height:420px;
    overflow-y:auto;
    overflow-x:hidden;
    padding:0 8px 30px 0;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:#aeb8b0 transparent;
    scroll-behavior:smooth;
}

.product-scroll::-webkit-scrollbar{
    width:9px;
}

.product-scroll::-webkit-scrollbar-track{
    background:#eef2ee;
    border-radius:10px;
}

.product-scroll::-webkit-scrollbar-thumb{
    background:#9fa9a1;
    border-radius:10px;
    border:2px solid #eef2ee;
}

.product-scroll::-webkit-scrollbar-thumb:hover{
    background:#7f8b82;
}

/* ============================================================
   PRODUCT TITLE
============================================================ */

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.title span{
    font-size:13px;
    color:#68736a;
}

/* ============================================================
   PRODUCT GRID
============================================================ */

.grid{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:16px;
}

/* ============================================================
   PRODUCT CARD
============================================================ */

.card{
    background:#fff;

    border:1px solid #e5e9e5;

    border-radius:16px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    transition:
        transform .18s,
        box-shadow .18s;
}

.card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 22px #0000000d;
}

.pic{
    width:100%;

    aspect-ratio:1;

    object-fit:cover;

    background:#eef3ed;
}

.info{
    padding:13px;

    display:flex;

    flex-direction:column;

    gap:6px;

    flex:1;
}

.category{
    font-size:11px;

    color:#15803d;

    font-weight:700;

    text-transform:uppercase;
}

.name{
    font-weight:700;
    font-size:16px;
}

.desc{
    font-size:12px;

    color:#68736a;

    min-height:32px;
}

.meta{
    display:flex;

    justify-content:space-between;

    color:#68736a;

    font-size:12px;
}

.bottom{
    margin-top:auto;

    padding-top:8px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:7px;
}

.price{
    font-size:18px;

    font-weight:800;
}

.add:disabled{
    background:#aab3ab;
    cursor:not-allowed;
}

.empty{
    text-align:center;

    background:#fff;

    border:1px dashed #cdd5ce;

    border-radius:15px;

    padding:40px;

    color:#68736a;

    grid-column:1/-1;
}

/* ============================================================
   FOOTER
============================================================ */

footer{
    text-align:center;

    color:#68736a;

    font-size:13px;

    padding:24px;
}

/* ============================================================
   CART OVERLAY
============================================================ */

.overlay{
    position:fixed;

    inset:0;

    background:#0008;

    z-index:30;

    display:none;
}

.overlay.show{
    display:block;
}

/* ============================================================
   CART DRAWER
============================================================ */

.drawer{
    position:fixed;

    right:0;

    top:0;

    width:min(
        430px,
        100%
    );

    height:100vh;

    background:#fff;

    z-index:31;

    transform:
        translateX(100%);

    transition:
        transform .25s;

    display:flex;

    flex-direction:column;
}

.drawer.open{
    transform:
        translateX(0);
}

.dhead{
    padding:16px;

    border-bottom:
        1px solid #e5e9e5;

    display:flex;

    justify-content:
        space-between;
}

.close{
    border:0;

    background:#f1f3f1;

    border-radius:50%;

    width:35px;

    height:35px;

    cursor:pointer;
}

.items{
    flex:1;

    overflow:auto;

    padding:14px;
}

.item{
    padding:12px 0;

    border-bottom:
        1px solid #e5e9e5;

    display:flex;

    justify-content:
        space-between;

    gap:10px;
}

.itemname{
    font-weight:700;
}

.muted{
    font-size:12px;

    color:#68736a;
}

.qty{
    display:flex;

    align-items:center;

    gap:8px;

    margin-top:7px;
}

.qty button{
    width:28px;

    height:28px;

    border:
        1px solid #e5e9e5;

    background:#fff;

    border-radius:7px;

    cursor:pointer;
}

.remove{
    border:0;

    background:none;

    color:#dc2626;

    font-size:12px;

    cursor:pointer;

    margin-top:4px;
}

.dfoot{
    border-top:
        1px solid #e5e9e5;

    padding:16px;
}

/* ============================================================
   EMPTY BASKET BUTTON
============================================================ */

.clear-cart{
    width:100%;
    border:1px solid #fecaca;
    background:#fff;
    color:#dc2626;
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:700;
    margin-bottom:10px;
    transition:
        background .18s,
        color .18s,
        transform .12s;
}

.clear-cart:hover:not(:disabled){
    background:#fef2f2;
}

.clear-cart:active:not(:disabled){
    transform:scale(.98);
}

.clear-cart:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.total{
    display:flex;

    justify-content:
        space-between;

    font-size:19px;

    font-weight:800;

    margin-bottom:12px;
}

.checkout,
.place{
    width:100%;
}

.checkout:disabled{
    opacity:.5;

    cursor:not-allowed;
}

/* ============================================================
   MODALS
============================================================ */

.modal{
    position:fixed;

    inset:0;

    background:#0009;

    z-index:50;

    display:none;

    align-items:center;

    justify-content:center;

    padding:16px;
}

.modal.show{
    display:flex;
}

.modalbox{
    background:#fff;

    width:min(
        500px,
        100%
    );

    max-height:92vh;

    overflow:auto;

    border-radius:18px;

    padding:20px;
}

.mhead{
    display:flex;

    justify-content:
        space-between;

    align-items:center;

    margin-bottom:15px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;

    font-size:13px;

    font-weight:700;

    margin-bottom:5px;
}

.field input,
.field textarea{
    width:100%;

    border:
        1px solid #e5e9e5;

    border-radius:9px;

    padding:11px;

    outline:none;
}

.field textarea{
    min-height:85px;
}

.success{
    text-align:center;

    padding:20px;
}

.check{
    width:60px;

    height:60px;

    border-radius:50%;

    background:#dcfce7;

    color:#166534;

    display:grid;

    place-items:center;

    margin:
        auto auto 12px;

    font-size:30px;
}

.wa{
    display:block;

    margin-top:12px;

    color:#166534;

    font-weight:700;

    text-decoration:none;
}


/* ============================================================
   CHECKOUT ADDRESS + LOCATION
============================================================ */

.checkout-note{
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    color:#166534;
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    margin-bottom:14px;
    line-height:1.45;
}

.address-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 12px;
}

.location-box{
    border:1px solid #dce3dd;
    border-radius:12px;
    padding:12px;
    margin:4px 0 14px;
    background:#fafcf9;
}

.location-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
}

.location-btn{
    border:1px solid #15803d;
    background:#fff;
    color:#166534;
    border-radius:9px;
    padding:10px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.location-btn.primary{
    background:#15803d;
    color:#fff;
}

.location-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.location-status{
    font-size:12px;
    color:#68736a;
    line-height:1.4;
    min-height:18px;
}

.map-link-input{
    margin-top:8px;
}

.order-preview{
    border:1px solid #e5e9e5;
    border-radius:12px;
    padding:12px;
    background:#fafcf9;
    margin:8px 0 14px;
}

.order-preview h3{
    font-size:14px;
    margin-bottom:8px;
}

.preview-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    padding:5px 0;
    border-bottom:1px solid #edf0ed;
}

.preview-item:last-child{
    border-bottom:0;
}

@media(max-width:520px){
    .address-grid{
        grid-template-columns:1fr;
    }

    .location-actions{
        grid-template-columns:1fr;
    }
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:950px){

    .shop-layout{
        grid-template-columns:145px minmax(0,1fr);
        gap:8px;
    }

    .category-sidebar{
        top:78px;
    }

    .cats,
    .product-scroll{
        height:calc(100vh - 165px);
    }

    .grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:700px){

    .shop-layout{
        grid-template-columns:1fr;
        gap:12px;
    }

    .category-sidebar{
        width:100%;
        position:sticky;
        top:76px;
        z-index:10;
        background:#f6f8f5;
        padding-bottom:4px;
    }

    .cats{
        flex-direction:column;
        gap:7px;
        height:180px;
        min-height:180px;
        padding-right:4px;
    }

    .product-scroll{
        height:calc(100vh - 310px);
        min-height:420px;
    }

    .cat{
        min-height:42px;
        padding:10px 12px;
        font-size:12px;
        flex:0 0 auto;
    }

    .head{
        flex-wrap:wrap;
    }

    .logo{
        flex:1;
    }

    .search{
        order:3;

        flex-basis:100%;
    }

    .grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    main{
        padding:
            16px 12px 60px;
    }

    .hero{
        padding:23px 18px;
    }

}

@media(max-width:390px){

    .grid{
        gap:9px;
    }

    .info{
        padding:9px;
    }

    .name{
        font-size:14px;
    }

    .price{
        font-size:15px;
    }

    .add{
        font-size:12px;

        padding:8px;
    }

    .product-qty button{
        width:30px;
        height:30px;
    }

}

</style>
</head>


<body>

<!-- ADD-TO-BASKET TOAST -->
<div id="basketToast" class="basket-toast" role="status" aria-live="polite"></div>

<!-- =========================================================
     TOP BAR
========================================================= -->

<div class="top">
    Fresh groceries • Easy ordering • Home delivery
</div>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

<div class="head">

    <div class="logo">

        <div class="logoicon">
            H
        </div>

        <div>

            <h1>
                Akbar Rice Bill
            </h1>

            <small>
                Online Grocery Store
            </small>

        </div>

    </div>


    <div class="search">

        <span>
            🔎
        </span>

        <input
